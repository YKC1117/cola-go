name: TeslaMock
options:
  bundleIdPrefix: com.teslamotors
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  TeslaMock:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teslamotors.TeslaApp
        PRODUCT_NAME: Tesla
        INFOPLIST_KEY_CFBundleDisplayName: Tesla
        TARGETED_DEVICE_FAMILY: "1,2"
  TeslaMockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TeslaMock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carkit.TeslaMockUITests
        TEST_TARGET_NAME: TeslaMock
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TeslaMock:
    build:
      targets:
        TeslaMock: all
    test:
      targets:
        - TeslaMockUITests
