name: Taoyuan parking source smoke

on:
  push:
    branches: ["feature/parking-taoyuan-live"]
    paths: [".github/workflows/taoyuan-parking-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Taoyuan official parking JSON
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url="https://opendata.tycg.gov.tw/api/dataset/f4cc0b12-86ac-40f9-8745-885bddc18f79/resource/0381e141-f7ee-450e-99da-2240208d1773/download"
          req=urllib.request.Request(url,headers={"User-Agent":"COLA-GO/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          print("ROWS",len(data))
          numeric=sum(1 for x in data if str(x.get("surplusSpace","")).isdigit())
          coords=sum(1 for x in data if x.get("wgsX") and x.get("wgsY"))
          print("NUMERIC_SURPLUS",numeric)
          print("COORDS",coords)
          assert len(data)>50
          assert numeric>20
          assert coords>50
          PY
