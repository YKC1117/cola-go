name: Taiwan Parking QA

on:
  push:
    branches: ["feature/taiwan-parking"]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - "data/parking.json"
      - "sw.js"
      - ".github/workflows/taiwan-parking-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and data checks
        run: |
          node --check assets/app.js
          node --check sw.js
          python3 -m json.tool data/parking.json >/dev/null
          python3 - <<'PY'
          import json
          data=json.load(open("data/parking.json",encoding="utf-8"))
          assert data["scope"]=="Taiwan"
          assert len(data["cities"])==22
          assert len({x["code"] for x in data["cities"]})==22
          print("PARKING_CITIES",len(data["cities"]))
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Nationwide parking browser regression
        run: |
          cat > parking-qa.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/';
          const out='parking-qa-artifacts';
          fs.mkdirSync(out,{recursive:true});

          const tainanLive={
            status:'live',
            updatedAt:'2026-09-25T04:00:00+08:00',
            items:[
              {id:'TN001',name:'永康測試停車場',zone:'永康區',address:'臺南市永康區中華路1號',car:18,carTotal:100,green:3,chargeTime:'24小時',chargeFee:'每小時30元',sourceUpdate:'2026-09-25 04:00:00',lat:23.02,lng:120.23}
            ]
          };
          const basic={
            CarParks:[
              {CarParkID:'NTP001',CarParkName:{Zh_tw:'新店轉運站停車場'},TownName:'新店區',Address:'新北市新店區央北二路',FareDescription:'每小時 30 元',LiveOccupancyAvailable:true,Position:{PositionLat:24.98,PositionLon:121.53}},
              {CarParkID:'NTP002',CarParkName:{Zh_tw:'板橋一般停車場'},TownName:'板橋區',Address:'新北市板橋區文化路',FareDescription:'依現場',LiveOccupancyAvailable:false,Position:{PositionLat:25.01,PositionLon:121.46}}
            ]
          };
          const availability={
            ParkingAvailabilities:[
              {CarParkID:'NTP001',CarParkName:{Zh_tw:'新店轉運站停車場'},TotalSpaces:120,AvailableSpaces:37,DataCollectTime:'2026-09-25T04:05:00+08:00'}
            ]
          };

          async function create(browserType,mode){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:430,height:932},
              isMobile:true,
              hasTouch:true,
              serviceWorkers:'block'
            });
            await context.addInitScript(()=>{
              window.__opened=[];
              window.open=(url)=>{window.__opened.push(String(url));return null;};
              sessionStorage.clear();
            });
            await context.route('**/data/parking-live-tainan.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(tainanLive)}));
            if(mode==='success'){
              await context.route('**/api/basic/v*/Parking/OffStreet/CarPark/City/NewTaipei*',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(basic)}));
              await context.route('**/api/basic/v*/Parking/OffStreet/CarPark/Availability/City/NewTaipei*',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(availability)}));
            }else if(mode==='fail'){
              await context.route('**/api/basic/v*/Parking/**',r=>r.abort());
            }
            return {browser,page:await context.newPage()};
          }

          async function runSuccess(browserType,label){
            const {browser,page}=await create(browserType,'success');
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="parking"]').first().click();

            if(await page.locator('#parkingCitySelect option').count()!==23)throw new Error(label+' city selector must contain all + 22 cities');
            if((await page.locator('#parkingScopeTitle').textContent()).trim()!=='全台灣')throw new Error(label+' default scope is not nationwide');
            if(await page.locator('#parkingCityGrid button').count()!==22)throw new Error(label+' city grid count');

            await page.locator('[data-national-map="google"]').click();
            if(!(await page.evaluate(()=>window.__opened.some(x=>x.includes('google.com/maps/search')))))throw new Error(label+' nationwide google fallback');

            await page.locator('#parkingCitySelect').selectOption('Tainan');
            await page.waitForTimeout(80);
            const tainanText=await page.locator('#liveParkingList').textContent();
            if(!tainanText.includes('永康測試停車場')||!tainanText.includes('18'))throw new Error(label+' Tainan live render');

            await page.locator('#parkingCitySelect').selectOption('NewTaipei');
            await page.waitForFunction(()=>document.querySelector('#parkingScopeStatus')?.textContent.includes('2 筆'),null,{timeout:5000});
            const text=await page.locator('#liveParkingList').textContent();
            if(!text.includes('新店轉運站停車場')||!text.includes('37'))throw new Error(label+' NewTaipei live availability');
            if(!text.includes('板橋一般停車場')||!text.includes('未提供'))throw new Error(label+' NewTaipei static fallback row');

            await page.locator('#parkingSearch').fill('板橋');
            await page.waitForTimeout(50);
            if(await page.locator('.parking-card').count()!==1)throw new Error(label+' parking search');

            await page.locator('[data-parking-map]').click();
            if(!(await page.evaluate(()=>window.__opened.some(x=>x.includes('google.com/maps/search')))))throw new Error(label+' parking map action');
            if(errors.length)throw new Error(label+' page errors: '+errors.join(' | '));

            await page.screenshot({path:out+'/parking-'+label+'.png',fullPage:true});
            await browser.close();
          }

          async function runFailure(){
            const {browser,page}=await create(chromium,'fail');
            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="parking"]').first().click();
            await page.locator('#parkingCitySelect').selectOption('HualienCounty');
            await page.waitForFunction(()=>document.querySelector('#parkingScopeStatus')?.textContent.includes('仍可搜尋與導航'),null,{timeout:12000});
            const text=await page.locator('#liveParkingList').textContent();
            if(!text.includes('花蓮縣')||!text.includes('Google Maps'))throw new Error('failure fallback content');
            await page.locator('[data-city-map="apple"]').click();
            if(!(await page.evaluate(()=>window.__opened.some(x=>x.includes('maps.apple.com')))))throw new Error('failure Apple Maps fallback');
            await browser.close();
          }

          await runSuccess(chromium,'chromium');
          await runSuccess(webkit,'webkit');
          await runFailure();
          console.log('TAIWAN_PARKING_QA_SUCCESS');
          EOF
          node parking-qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-parking-qa
          path: parking-qa-artifacts
          retention-days: 2
