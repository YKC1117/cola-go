name: CarKit Tesla Donor Probe

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - .github/workflows/carkit-tesla-donor-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and decode public Tesla shortcut donors
        run: |
          python3 - <<'PY'
          import json, plistlib, urllib.request, pathlib, copy

          donors = {
              "open_rear_trunk": "5f0d4cb581934a1e98c9799b37f10f63",
              "close_rear_trunk": "bf6e57155d1843b68609d0fcadda0b9a",
              "open_frunk": "2ad16b77df624310b7cb649cfb82ea06",
              "open_charge_port": "4f7686cd6b184861b92cd44deb96e8a0",
              # These public links are probed only to determine whether they
              # contain native Tesla AppIntents. API/token-based shortcuts are
              # rejected by construction because only Tesla AppIntent actions
              # are emitted below.
              "candidate_honk": "8e23c21e0f6a4bdb981aa4f6f7dd099e",
              "candidate_close_charge_port": "4f628891dd32422fb0e831e9afb1ba29",
              "candidate_start_charging": "43a879a90e344d258c54535e3b6506d6",
              "candidate_stop_charging": "da72905a7a404d2cb69bb5b13424be24",
              "candidate_native_tesla_menu": "d54424f0770449909293833439d86b6c",
              # 2026 public Tesla-owner shortcut with multiple native
              # Set Temperature actions; useful for studying vehicle binding.
              "candidate_multi_temp_2026": "3c461b592b644b3cb158a9f98db225c9",
              "candidate_action_button_menu": "0d17a1d0a40f450fb1fcbdba3d4644f5",
          }

          def get_json(url):
              req=urllib.request.Request(url, headers={"User-Agent":"CarKitTW-donor-probe/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def get_bytes(url):
              req=urllib.request.Request(url, headers={"User-Agent":"CarKitTW-donor-probe/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def record_from(meta):
              if isinstance(meta, dict) and isinstance(meta.get("records"), list):
                  return meta["records"][0]
              return meta

          def scrub(v, key=""):
              lk=key.lower()
              if any(x in lk for x in ("vehicle","vin","image","photo","account","token")):
                  return "<REDACTED>"
              if isinstance(v, dict):
                  return {k:scrub(x,k) for k,x in v.items()}
              if isinstance(v, list):
                  return [scrub(x,key) for x in v]
              if isinstance(v, (bytes,bytearray)):
                  return f"<BYTES:{len(v)}>"
              return v

          out={}
          for name, sid in donors.items():
              meta=get_json(f"https://www.icloud.com/shortcuts/api/records/{sid}")
              rec=record_from(meta)
              fields=rec["fields"]
              asset=fields.get("shortcut") or fields.get("signedShortcut")
              url=asset["value"]["downloadURL"]
              # Some CloudKit asset URLs expose a literal placeholder.
              url=url.replace("${f}", "shortcut")
              raw=get_bytes(url)
              wf=plistlib.loads(raw)
              actions=[]
              for idx,a in enumerate(wf.get("WFWorkflowActions",[])):
                  ident=a.get("WFWorkflowActionIdentifier","")
                  p=a.get("WFWorkflowActionParameters",{})
                  desc=p.get("AppIntentDescriptor",{})
                  if (
                      ident.startswith("com.teslamotors.TeslaApp.")
                      or desc.get("BundleIdentifier")=="com.teslamotors.TeslaApp"
                  ):
                      actions.append({
                          "index":idx,
                          "identifier":ident,
                          "parameters":scrub(p)
                      })
              # For the 2026 multi-temperature donor, also capture only
              # the sanitized actions that create/update the Temp variable so
              # we can preserve the donor's value type without exposing any
              # vehicle entity.
              temp_source_actions=[]
              if name=="candidate_multi_temp_2026":
                  for idx,a in enumerate(wf.get("WFWorkflowActions",[])):
                      p=a.get("WFWorkflowActionParameters",{})
                      if p.get("WFVariableName")=="Temp":
                          start=max(0,idx-1)
                          temp_source_actions=[
                              {"index":j,"identifier":wf["WFWorkflowActions"][j].get("WFWorkflowActionIdentifier",""),
                               "parameters":scrub(wf["WFWorkflowActions"][j].get("WFWorkflowActionParameters",{}))}
                              for j in range(start,idx+1)
                          ]

              import_questions=[]
              for q in wf.get("WFWorkflowImportQuestions",[]):
                  qq=copy.deepcopy(q)
                  # Never emit donor vehicle defaults/entities.
                  for k in list(qq):
                      if any(x in k.lower() for x in ("default","vehicle","vin","image","photo","account","token")):
                          qq[k]="<REDACTED>"
                  import_questions.append(scrub(qq))
              out[name]={
                  "share_id":sid,
                  "workflow_name":fields.get("name",{}).get("value"),
                  "tesla_actions":actions,
                  "tesla_action_count":len(actions),
                  "import_question_count":len(import_questions),
                  "import_questions":import_questions,
                  "temp_source_actions":temp_source_actions,
              }

          pathlib.Path("/tmp/tesla-donors.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload sanitized donor evidence
        uses: actions/upload-artifact@v4
        with:
          name: carkit-tesla-donor-evidence
          path: /tmp/tesla-donors.json
