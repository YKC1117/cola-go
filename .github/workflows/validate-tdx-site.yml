name: Validate TDX website integration

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "scripts/sync_tdx.py"
      - "assets/tdx-runtime.js"
      - "assets/app.js"
      - "assets/styles.css"
      - "index.html"
      - "scripts/verify_ui_v6.cjs"
      - "sw.js"
      - ".github/workflows/sync-tdx-data.yml"
      - ".github/workflows/validate-tdx-site.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/sync_tdx.py
      - name: Parking availability sanity guard
        run: |
          python3 - <<'PY'
          from scripts.sync_tdx import validated_parking_available
          assert validated_parking_available(235, 55) == 55
          assert validated_parking_available(235, 254) is None
          assert validated_parking_available(235, -1) is None
          assert validated_parking_available(235, None) is None
          assert validated_parking_available(0, 12) == 12
          assert validated_parking_available(None, 12) == 12
          PY
      - name: Charging schema sanity guard
        run: |
          python3 - <<'PY'
          from scripts.sync_tdx import (
              classify_live_state, connector_type_name, power_mode_name,
              power_rating_kw, station_location,
          )
          assert classify_live_state(1) == "available"
          assert classify_live_state(2) == "occupied"
          assert classify_live_state(3) == "fault"
          assert classify_live_state(0) == "unknown"
          assert connector_type_name(2) == "CCS2"
          assert connector_type_name(5) == "J1772"
          assert connector_type_name(6) == "Type2"
          assert connector_type_name(254) == "其他"
          assert connector_type_name(255) == "其他"
          assert power_mode_name(1) == "AC"
          assert power_mode_name(2) == "DC"
          assert power_rating_kw("250kW") == 250
          assert power_rating_kw(11) == 11
          location=station_location({
              "Location":{"Address":{"City":"臺南市","Town":"東區","Road":"民族路一段","Lane":"17巷","No":"37號對面"}}
          },"臺南市")
          assert location == "臺南市東區民族路一段17巷37號對面"
          assert station_location({"Location":{"Place":{"POI":"臺南轉運站"}}},"臺南市") == "臺南轉運站"
          assert station_location({"Location":{"Freeway":{"RoadName":"國道1號","Direction":"北上","Milepost":"319K"}}},"臺南市") == "國道1號北上319K"
          assert station_location({"Address":"臺南市","Location":{"CityRoad":{"City":"臺南市","Town":"永康區","Road":"中正北路"}}},"臺南市") == "臺南市永康區中正北路"
          PY
      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/tdx-runtime.js
      - name: Integration markers
        run: |
          grep -q 'assets/tdx-runtime.js' index.html
          grep -q 'TDX_CLIENT_ID' .github/workflows/sync-tdx-data.yml
          grep -q 'TDX_CLIENT_SECRET' .github/workflows/sync-tdx-data.yml
          grep -q '^  workflow_dispatch:' .github/workflows/sync-tdx-data.yml
          grep -q '^  schedule:' .github/workflows/sync-tdx-data.yml
          ! grep -q '^  push:' .github/workflows/sync-tdx-data.yml
          grep -Fq 'cancel-in-progress: false' .github/workflows/sync-tdx-data.yml
          grep -Fq 'snapshot="$(mktemp -d)"' .github/workflows/sync-tdx-data.yml
          grep -Fq 'git reset --hard origin/main' .github/workflows/sync-tdx-data.yml
          grep -Fq 'git push origin HEAD:main' .github/workflows/sync-tdx-data.yml
          ! grep -Fq 'git pull --rebase origin main' .github/workflows/sync-tdx-data.yml
          test ! -f .github/workflows/tdx-worker.yml
          grep -q 'ConnectorLiveStatus' scripts/sync_tdx.py
          grep -q 'LastUpdateTime' scripts/sync_tdx.py
          grep -q 'PowerRating' scripts/sync_tdx.py
          grep -q 'Operator/City/' scripts/sync_tdx.py
          grep -Fq 'id="chargingAvailableOnly"' index.html
          grep -Fq 'id="chargingNearby"' index.html
          grep -q 'chargingLiveCounts' assets/app.js
          grep -q 'chargingAvailableOnly' assets/app.js
          grep -q 'const TAIWAN_CITIES=' assets/app.js
          grep -q 'chargingOperatorLabel' assets/app.js
          grep -q 'bindSelect("chargingCity","chargingCity")' assets/app.js
          grep -q 'Road/Traffic/Live/Freeway' scripts/sync_tdx.py
          grep -q 'data/tdx/traffic.json' assets/tdx-runtime.js
          grep -q 'data/tdx/tunnel.json' assets/tdx-runtime.js
          grep -q 'sanitizeParkingItems' assets/tdx-runtime.js
          grep -Fq '$$("[data-go]").forEach' assets/app.js
          grep -q 'location.reload()' assets/app.js
          ! grep -R -E 'client_secret[[:space:]]*[:=][[:space:]]*["'\''"][A-Za-z0-9_-]{12,}' scripts assets .github/workflows || exit 1
