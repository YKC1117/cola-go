name: CarKit Shortcut Build

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - "carkit-sign/**"
      - ".github/workflows/carkit-sign.yml"

jobs:
  build-sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Tesla charging donor
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, plistlib
          from urllib.request import Request, urlopen

          sid="56db63f833fb4201a83c648cfaf89b72"
          api=f"https://www.icloud.com/shortcuts/api/records/{sid}"
          with urlopen(Request(api,headers={"User-Agent":"Mozilla/5.0"}),timeout=30) as r:
              meta=json.load(r)
          rec=meta["records"][0] if isinstance(meta,dict) and "records" in meta else meta
          fields=rec["fields"]
          name=fields.get("name",{}).get("value",sid)
          url=fields["shortcut"]["value"]["downloadURL"].replace("${f}","shortcut.plist")
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=30) as r:
              raw=r.read()
          wf=plistlib.loads(raw)
          print("DONOR",sid,name,"actions",len(wf.get("WFWorkflowActions",[])))
          for i,a in enumerate(wf.get("WFWorkflowActions",[])):
              ident=a.get("WFWorkflowActionIdentifier","")
              params=a.get("WFWorkflowActionParameters",{})
              blob=json.dumps({"index":i,"identifier":ident,"params":params},ensure_ascii=False,default=str)
              if "tesla" in blob.lower() or "appintent" in blob.lower():
                  print("TESLA_ACTION",blob[:12000])
          PY

      - name: Build shortcuts
        run: |
          set -euxo pipefail
          rm -rf carkit-sign/generated carkit-sign/out
          python3 carkit-sign/build_oil.py
          python3 carkit-sign/build_tesla.py
          for f in carkit-sign/generated/*.shortcut.xml; do
            plutil -lint "$f"
          done
          ls -lh carkit-sign/generated

      - name: Static semantic validation
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/viticci/shortcuts-playground-plugin.git /tmp/shortcuts-playground
          VALIDATOR=/tmp/shortcuts-playground/codex/skills/shortcuts-playground/scripts/validate_shortcut.py
          python3 "$VALIDATOR" --help
          python3 "$VALIDATOR" carkit-sign/generated/Oil-Driver-v0.4.shortcut.xml --target-platform ios --target-macos 27
          python3 "$VALIDATOR" carkit-sign/generated/Tesla-Driver-v0.4.shortcut.xml --target-platform ios --target-macos 27

      - name: Sign generated shortcuts
        run: |
          set -euxo pipefail
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          src_dir=Path("carkit-sign/generated")
          out_dir=Path("carkit-sign/out")
          for p in sorted(src_dir.glob("*.shortcut.xml")):
              name=p.name.removesuffix(".shortcut.xml")
              payload=json.dumps({
                  "shortcutName":name,
                  "shortcut":p.read_text(encoding="utf-8")
              }).encode()
              req=Request(
                  "https://hubsign.routinehub.services/sign",
                  data=payload,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"},
                  method="POST",
              )
              with urlopen(req,timeout=60) as resp:
                  signed=resp.read()
              if signed[:4] != b"AEA1":
                  raise SystemExit(f"{name}: invalid signed header {signed[:16]!r}")
              out=out_dir/f"{name}.shortcut"
              out.write_bytes(signed)
              print(name, len(signed), signed[:4])
          PY
          for f in carkit-sign/out/*.shortcut; do
            test "$(xxd -p -l 4 "$f")" = "41454131"
            shasum -a 256 "$f"
          done
          ls -lh carkit-sign/out

      - name: Upload signed shortcuts
        uses: actions/upload-artifact@v4
        with:
          name: carkit-signed-shortcuts-v0.4
          path: carkit-sign/out/*.shortcut
          if-no-files-found: error

      - name: Upload workflow sources
        uses: actions/upload-artifact@v4
        with:
          name: carkit-shortcut-sources-v0.4
          path: carkit-sign/generated/*.shortcut.xml
          if-no-files-found: error
