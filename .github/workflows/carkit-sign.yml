name: CarKit Shortcut Build

concurrency:
  group: carkit-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - "carkit-sign/**"
      - ".github/workflows/carkit-sign.yml"

jobs:
  build-sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build shortcuts
        run: |
          set -euxo pipefail
          rm -rf carkit-sign/generated carkit-sign/out
          python3 carkit-sign/build_oil.py
          python3 carkit-sign/build_tesla.py
          for f in carkit-sign/generated/*.shortcut.xml; do
            plutil -lint "$f"
          done
          ls -lh carkit-sign/generated

      - name: Static semantic validation
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/viticci/shortcuts-playground-plugin.git /tmp/shortcuts-playground
          VALIDATOR=/tmp/shortcuts-playground/codex/skills/shortcuts-playground/scripts/validate_shortcut.py
          for f in carkit-sign/generated/*.shortcut.xml; do
            python3 "$VALIDATOR" "$f" --target-platform ios --target-macos 27
          done

      - name: CarKit privacy and safety validation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path

          g=Path("carkit-sign/generated")
          expected={"特斯拉助手.shortcut.xml","油車助手.shortcut.xml"}
          actual={p.name for p in g.glob("*.shortcut.xml")}
          assert actual == expected, (actual, expected)

          def load(name):
              return plistlib.loads((g/name).read_bytes())

          def assert_unique_uuids(wf,label):
              vals=[]
              for a in wf.get("WFWorkflowActions",[]):
                  u=a.get("WFWorkflowActionParameters",{}).get("UUID")
                  if u: vals.append(u)
              dup={u for u in vals if vals.count(u)>1}
              assert not dup, f"{label}: duplicate UUIDs: {sorted(dup)[:5]}"

          tesla=load("特斯拉助手.shortcut.xml")
          oil=load("油車助手.shortcut.xml")
          # Product polish: stable public names/icons.
          assert oil.get("WFWorkflowName")=="油車助手"
          assert tesla.get("WFWorkflowName")=="特斯拉助手"
          assert oil.get("WFWorkflowIcon",{}).get("WFWorkflowIconGlyphNumber")==59452
          assert tesla.get("WFWorkflowIcon",{}).get("WFWorkflowIconGlyphNumber")==61447
          assert_unique_uuids(tesla,"Tesla")
          assert_unique_uuids(oil,"Oil")

          tblob=(g/"特斯拉助手.shortcut.xml").read_text(encoding="utf-8")
          for private in [
              "5YJ3E1ET9SF029430","5YJ3E1EC3PF497483",
              "SwordFish","TSLAMARS","intents-remote-image-proxy"
          ]:
              assert private not in tblob, f"private donor value leaked: {private}"
          assert "我的 Tesla" not in tblob

          actions=tesla["WFWorkflowActions"]
          questions=tesla.get("WFWorkflowImportQuestions",[])
          vehicle_action_indexes=[
              i for i,a in enumerate(actions)
              if a.get("WFWorkflowActionIdentifier","").startswith("com.teslamotors.TeslaApp.")
              and "vehicle" in a.get("WFWorkflowActionParameters",{})
          ]
          assert questions, "Tesla vehicle import questions missing"
          assert len(questions)==len(vehicle_action_indexes), (
              len(questions), len(vehicle_action_indexes)
          )
          assert len(questions) == 12, f"Tesla v1.4 should require exactly 12 vehicle setup questions for full remote control: {len(questions)}"
          for q in questions:
              assert q.get("Category")=="Parameter", q
              assert q.get("ParameterKey")=="vehicle", q
              assert "DefaultValue" not in q, "public shortcut must not embed a donor/default Tesla"
              idx=q.get("ActionIndex")
              assert isinstance(idx,int) and not isinstance(idx,bool), q
              assert 0 <= idx < len(actions), q
              assert idx in vehicle_action_indexes, q
              target=actions[idx]
              assert target.get("WFWorkflowActionParameters",{}).get("vehicle")=={
                  "Value":{"Type":"Ask"},
                  "WFSerializationType":"WFTextTokenAttachment"
              }, q
              assert "Tesla" in q.get("Text",""), q
          assert sorted(q["ActionIndex"] for q in questions)==sorted(vehicle_action_indexes)

          tesla_intent_count=sum(
              1 for a in actions
              if a.get("WFWorkflowActionIdentifier","").startswith("com.teslamotors.TeslaApp.")
          )
          assert tesla_intent_count <= 25, f"Tesla AppIntent duplication regressed: {tesla_intent_count}"

          actions=tesla["WFWorkflowActions"]
          bundle="com.teslamotors.TeslaApp"
          evidenced={
              "HVACSetTempIntent","ChargeLimitIntent","PreconditionIntent",
              "LockUnlockIntent","RearTrunkIntent","FrontTrunkIntent",
              "DefrostIntent","VentIntent","CloseWindowIntent",
              "SentryModeIntent","FlashLightIntent","ChargePortIntent",
              "HVACSeatHeaterIntent","HonkIntent"
          }
          ask={"Value":{"Type":"Ask"},"WFSerializationType":"WFTextTokenAttachment"}

          expected_intent_counts={
              "PreconditionIntent":2,
              "HVACSetTempIntent":1,
              "LockUnlockIntent":2,
              "FrontTrunkIntent":1,
              "RearTrunkIntent":1,
              "ChargeLimitIntent":2,
              "ChargePortIntent":2,
              "FlashLightIntent":1,
              "HonkIntent":1,
              "DefrostIntent":2,
              "HVACSeatHeaterIntent":2,
              "VentIntent":1,
              "CloseWindowIntent":1,
              "SentryModeIntent":1,
          }
          actual_intent_counts={k:0 for k in expected_intent_counts}
          vehicle_optional={"ChargeLimitIntent","FlashLightIntent","HVACSeatHeaterIntent","ChargePortIntent","HonkIntent"}
          for a in actions:
              ident=a.get("WFWorkflowActionIdentifier","")
              p=a.get("WFWorkflowActionParameters",{})
              if ident.startswith(bundle+"."):
                  intent=ident.split(".")[-1]
                  assert intent in evidenced, f"unsupported/unproven Tesla intent: {intent}"
                  actual_intent_counts[intent]=actual_intent_counts.get(intent,0)+1
                  descriptor=p.get("AppIntentDescriptor")
                  assert isinstance(descriptor,dict), f"{intent}: missing AppIntentDescriptor"
                  assert descriptor.get("TeamIdentifier")=="PS9EBAM2PU", f"{intent}: donor TeamIdentifier mismatch"
                  assert descriptor.get("BundleIdentifier")==bundle, f"{intent}: donor BundleIdentifier mismatch"
                  assert descriptor.get("AppIntentIdentifier")==intent, f"{intent}: descriptor/outer intent mismatch"
                  assert ident==f"{bundle}.{descriptor['AppIntentIdentifier']}", f"{intent}: outer identifier mismatch"
                  if intent in vehicle_optional:
                      assert "vehicle" not in p, f"{intent}: invented vehicle parameter"
                  else:
                      assert "vehicle" in p, f"{intent}: required donor vehicle parameter missing"
                      assert p["vehicle"] == ask, f"{intent}: vehicle is not runtime Ask candidate"
          assert actual_intent_counts==expected_intent_counts, (actual_intent_counts,expected_intent_counts)
          assert sum(actual_intent_counts.values())==20, actual_intent_counts
          assert len(vehicle_action_indexes)==12, vehicle_action_indexes

          # Keep one HVAC temperature action and feed it a variable magnitude.
          hvac_temp=[a for a in actions if a.get("WFWorkflowActionIdentifier","").endswith(".HVACSetTempIntent")]
          assert len(hvac_temp)==1, hvac_temp
          temp_value=hvac_temp[0]["WFWorkflowActionParameters"]["temperature"]
          assert temp_value.get("WFSerializationType")=="WFQuantityFieldValue", temp_value
          assert temp_value.get("Value",{}).get("Unit")=="°C", temp_value
          assert temp_value.get("Value",{}).get("Magnitude")=={
              "VariableName":"Temp","Type":"Variable"
          }, temp_value
          temp_numbers=[
              a.get("WFWorkflowActionParameters",{}).get("WFNumberActionNumber")
              for a in actions
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.number"
          ]
          assert all(str(x) in temp_numbers for x in (22,23,24)), temp_numbers

          # Tesla iOS automation must not pretend Bluetooth Disconnect exists.
          # iOS 27 exposes Bluetooth connect only; parked-car location is supplied
          # by Apple Maps after vehicle Bluetooth disconnect.
          assert "AUTO_END" not in tblob, "Tesla must not expose nonexistent Bluetooth AUTO_END"
          assert "is.workflow.actions.getparkedcarlocation" in tblob, "Tesla parked-car navigation missing"

          # Bluetooth/automation routing is before the main interactive menu.
          # No Tesla physical/control AppIntent may be reachable in that prefix.
          main_menu_idx=next(
              i for i,a in enumerate(actions)
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.choosefrommenu"
              and a.get("WFWorkflowActionParameters",{}).get("WFMenuPrompt")=="特斯拉助手｜請選功能"
              and a.get("WFWorkflowActionParameters",{}).get("WFControlFlowMode")==0
          )
          assert not any(
              a.get("WFWorkflowActionIdentifier","").startswith(bundle+".")
              for a in actions[:main_menu_idx]
          ), "Tesla AppIntent found in AUTO_START prefix"

          # Voice conditions are equality-only. This prevents phrases such as
          # '不要解鎖' from matching '解鎖'.
          for a in actions:
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.conditional":
                  p=a.get("WFWorkflowActionParameters",{})
                  if "WFConditionalActionString" in p:
                      assert p.get("WFCondition")==4, f"non-exact text condition: {p}"

          # Sensitive physical actions remain single canonical AppIntents shared
          # by touch and voice. Touch uses a confirmation menu; voice requires
          # the exact spoken word 「確認」 before the same canonical action runs.
          sensitive=[]
          for i,a in enumerate(actions):
              ident=a.get("WFWorkflowActionIdentifier","")
              p=a.get("WFWorkflowActionParameters",{})
              if ident.endswith(".FrontTrunkIntent") or ident.endswith(".RearTrunkIntent"):
                  sensitive.append((i,ident))
              elif ident.endswith(".LockUnlockIntent") and p.get("vehicleControlType")=="unlock":
                  sensitive.append((i,ident))
          assert len(sensitive)==3, f"sensitive Tesla actions duplicated or missing: {sensitive}"

          touch_prompts=[
              a.get("WFWorkflowActionParameters",{}).get("WFMenuPrompt","")
              for a in actions
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.choosefrommenu"
              and a.get("WFWorkflowActionParameters",{}).get("WFControlFlowMode")==0
              and a.get("WFWorkflowActionParameters",{}).get("WFMenuPrompt","").startswith("確定要")
          ]
          assert sorted(touch_prompts)==sorted([
              "確定要解鎖 Tesla？","確定要開啟前行李廂？","確定要開啟後車廂？"
          ]), touch_prompts

          voice_prompts=[
              a.get("WFWorkflowActionParameters",{}).get("WFAskActionPrompt","")
              for a in actions
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.ask"
              and a.get("WFWorkflowActionParameters",{}).get("WFAskActionPrompt","").startswith("確定要")
          ]
          assert len(voice_prompts)==3, voice_prompts
          assert all("確認" in x and "取消" in x for x in voice_prompts), voice_prompts
          voice_confirm_conditions=[
              a for a in actions
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.conditional"
              and a.get("WFWorkflowActionParameters",{}).get("WFConditionalActionString")=="確認"
              and a.get("WFWorkflowActionParameters",{}).get("WFCondition")==4
          ]
          assert len(voice_confirm_conditions)==3, voice_confirm_conditions

          # Donor-proven enum handling. Keep unresolved enums on Ask; only promote
          # a fixed value when a public native donor proves it.
          for a in actions:
              ident=a.get("WFWorkflowActionIdentifier","")
              p=a.get("WFWorkflowActionParameters",{})
              if ident.endswith(".RearTrunkIntent"):
                  # Public 2025 native Tesla donors prove both "open" and "close".
                  # CarKit intentionally keeps one canonical rear-trunk action
                  # using "open" so vehicle import questions do not increase.
                  assert p.get("rearTrunkAction")=="open"
                  assert p.get("vehicle")==ask
              if ident.endswith(".DefrostIntent"):
                  assert p.get("defrostAction") in {"enable","disable"}
              if ident.endswith(".SentryModeIntent"):
                  assert p.get("vehicleModeAction")==ask
              if ident.endswith(".ChargePortIntent"):
                  assert p.get("chargePortAction") in {"open","close"}
                  assert "vehicle" not in p
              if ident.endswith(".HonkIntent"):
                  assert "vehicle" not in p
              if ident.endswith(".HVACSeatHeaterIntent"):
                  assert p.get("seat")=="frontLeft"
                  assert p.get("level") in {"high","off"}
                  assert "vehicle" not in p

          # Unsupported native actions remain absent until a donor is obtained.
          for forbidden in [
              "HornIntent","StartChargingIntent","StopChargingIntent",
              "DogModeIntent","CampModeIntent","Bioweapon"
          ]:
              assert forbidden not in tblob, f"unproven intent leaked: {forbidden}"

          # Product UX guardrail: keep the public top-level menus compact.
          def top_menu_items(wf_obj,prompt):
              for a in wf_obj["WFWorkflowActions"]:
                  p=a.get("WFWorkflowActionParameters",{})
                  if (a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.choosefrommenu"
                      and p.get("WFControlFlowMode")==0
                      and p.get("WFMenuPrompt")==prompt):
                      return p.get("WFMenuItems",[])
              raise AssertionError(f"missing top menu: {prompt}")
          assert top_menu_items(oil,"油車助手｜請選功能")==[
              "神盾","導航","路況","停車 / 找車","加油 / eTag","音樂"
          ]
          assert top_menu_items(tesla,"特斯拉助手｜請選功能")==[
              "快速出發","車外遙控","導航","找充電站","停車 / 找車","行車工具","語音控制","Tesla App"
          ]

          # Voice control is embedded in 特斯拉助手; no second shortcut is required.
          voice_asks=[
              a.get("WFWorkflowActionParameters",{}).get("WFAskActionPrompt","")
              for a in actions
              if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.ask"
          ]
          assert "要控制 Tesla 什麼功能？" in voice_asks, voice_asks
          assert "VoiceMode" in tblob, "integrated Tesla voice mode missing"
          assert "沒有辨識到這個指令" in tblob, "integrated voice fallback missing"
          assert "特斯拉語音控制" not in {p.stem for p in g.glob("*.shortcut.xml")}, (
              "standalone Tesla voice helper must not be generated"
          )

          oblob=(g/"油車助手.shortcut.xml").read_text(encoding="utf-8")

          # iOS 26 app-picker regression guard: every Open App action must
          # carry both the bundle identifier and the selected-app descriptor.
          for name,wf_obj in [("Oil",oil),("Tesla",tesla)]:
              open_apps=[
                  a for a in wf_obj["WFWorkflowActions"]
                  if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.openapp"
              ]
              assert open_apps, f"{name}: expected Open App actions"
              for a in open_apps:
                  p=a.get("WFWorkflowActionParameters",{})
                  bundle=p.get("WFAppIdentifier")
                  selected=p.get("WFSelectedApp",{})
                  assert bundle, f"{name}: Open App missing WFAppIdentifier"
                  assert selected.get("BundleIdentifier")==bundle, (
                      f"{name}: Open App selected bundle mismatch: {bundle!r} vs {selected!r}"
                  )
                  assert selected.get("Name"), f"{name}: Open App missing selected app name"

          # Navigation regression guard: use Shortcuts-native Open Directions.
          # The destination must be the output of the runtime Ask action, never
          # a baked-in address and never a hand-built URL.
          for name,wf_obj in [("Oil",oil),("Tesla",tesla)]:
              aa=wf_obj["WFWorkflowActions"]
              asks={
                  a.get("WFWorkflowActionParameters",{}).get("UUID")
                  for a in aa
                  if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.ask"
                  and a.get("WFWorkflowActionParameters",{}).get("WFAskActionPrompt")
                     =="要去哪裡？可輸入地址、店名或地標"
              }
              directions=[
                  a for a in aa
                  if a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.getdirections"
              ]
              expected_nav_count=6 if name=="Tesla" else 3
              assert len(asks)==expected_nav_count, (
                  f"{name}: expected {expected_nav_count} navigation Ask actions, got {len(asks)}"
              )
              assert len(directions)==expected_nav_count, (
                  f"{name}: expected {expected_nav_count} Open Directions actions, got {len(directions)}"
              )
              assert {
                  a.get("WFWorkflowActionParameters",{}).get("WFGetDirectionsActionApp")
                  for a in directions
              }=={"Maps","Google Maps","Waze"}, f"{name}: navigation app set is wrong"
              for a in directions:
                  p=a.get("WFWorkflowActionParameters",{})
                  dest=p.get("WFDestination",{})
                  assert dest.get("WFSerializationType")=="WFTextTokenAttachment", (
                      f"{name}: Open Directions destination is not an action-output token"
                  )
                  v=dest.get("Value",{})
                  assert v.get("Type")=="ActionOutput", f"{name}: destination is not ActionOutput"
                  assert v.get("OutputUUID") in asks, (
                      f"{name}: destination is not connected to its runtime Ask action"
                  )
                  assert v.get("OutputName")=="Provided Input"
                  if p.get("WFGetDirectionsActionApp") in {"Maps","Google Maps"}:
                      assert p.get("WFGetDirectionsActionMode")=="Driving"
              assert not any(
                  a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.urlencode"
                  for a in aa
              ), f"{name}: legacy URL navigation remains"

          # User-facing shortcuts must be runnable by a plain tap with no
          # Shortcut Input / automation magic values. Those belong in separate
          # helper shortcuts, never in the main UI.
          oblob=(g/"油車助手.shortcut.xml").read_text(encoding="utf-8")
          assert "ExtensionInput" not in tblob, "Tesla main shortcut still depends on Shortcut Input"
          assert "ExtensionInput" not in oblob, "Oil main shortcut still depends on Shortcut Input"
          for marker in ["AUTO_START","AUTO_END"]:
              assert marker not in tblob, f"Tesla main shortcut leaked automation marker: {marker}"
              assert marker not in oblob, f"Oil main shortcut leaked automation marker: {marker}"

          # Oil shortcut stays oil-only.
          oblob=(g/"油車助手.shortcut.xml").read_text(encoding="utf-8")
          assert "com.teslamotors.TeslaApp" not in oblob
          assert "充電上限" not in oblob
          assert "HVACSetTempIntent" not in oblob

          # Both shortcuts are menu-first: tapping the shortcut or invoking
          # it through Siri must immediately expose a readable function menu.
          expected_prompts={"Tesla":"特斯拉助手｜請選功能","Oil":"油車助手｜請選功能"}
          for name,wf_obj in [("Tesla",tesla),("Oil",oil)]:
              aa=wf_obj["WFWorkflowActions"]
              prompt=expected_prompts[name]
              assert any(
                  a.get("WFWorkflowActionIdentifier")=="is.workflow.actions.choosefrommenu"
                  and a.get("WFWorkflowActionParameters",{}).get("WFMenuPrompt")==prompt
                  and a.get("WFWorkflowActionParameters",{}).get("WFControlFlowMode")==0
                  for a in aa
              ), f"{name}: missing direct main menu"
              assert aa[-1].get("WFWorkflowActionIdentifier")=="is.workflow.actions.exit"

          print("CarKit structural/privacy/safety checks: PASS")
          print("Runtime vehicle entity selection: NOT RUN (requires iPhone + Tesla App)")
          print("Siri execution: NOT RUN (requires iPhone/Siri)")
          print("Tesla vehicle control: NOT RUN (requires Tesla account/vehicle)")
          PY

      - name: Sign generated shortcuts
        run: |
          set -euxo pipefail
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          src_dir=Path("carkit-sign/generated")
          out_dir=Path("carkit-sign/out")
          for p in sorted(src_dir.glob("*.shortcut.xml")):
              name=p.name.removesuffix(".shortcut.xml")
              payload=json.dumps({
                  "shortcutName":name,
                  "shortcut":p.read_text(encoding="utf-8")
              }).encode()
              req=Request(
                  "https://hubsign.routinehub.services/sign",
                  data=payload,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"},
                  method="POST",
              )
              with urlopen(req,timeout=60) as resp:
                  signed=resp.read()
              if signed[:4] != b"AEA1":
                  raise SystemExit(f"{name}: invalid signed header {signed[:16]!r}")
              out=out_dir/f"{name}.shortcut"
              out.write_bytes(signed)
              print(name, len(signed), signed[:4])
          PY
          for f in carkit-sign/out/*.shortcut; do
            test "$(xxd -p -l 4 "$f")" = "41454131"
            shasum -a 256 "$f"
          done
          ls -lh carkit-sign/out

      - name: Upload signed shortcuts
        uses: actions/upload-artifact@v4
        with:
          name: carkit-signed-shortcuts
          path: carkit-sign/out/*.shortcut
          if-no-files-found: error

      - name: Upload workflow sources
        uses: actions/upload-artifact@v4
        with:
          name: carkit-shortcut-sources
          path: carkit-sign/generated/*.shortcut.xml
          if-no-files-found: error
