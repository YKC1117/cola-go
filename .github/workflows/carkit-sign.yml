name: CarKit Shortcut Sign Test

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - "carkit-sign/**"
      - ".github/workflows/carkit-sign.yml"

jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate plist
        run: plutil -lint carkit-sign/Test.shortcut.xml
      - name: Sign through current Cherri HubSign protocol
        run: |
          set -euxo pipefail
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          src = Path("carkit-sign/Test.shortcut.xml").read_text(encoding="utf-8")
          payload = json.dumps({"shortcutName":"CarKit Sign Test","shortcut":src}).encode()
          req = Request(
              "https://hubsign.routinehub.services/sign",
              data=payload,
              headers={
                  "Content-Type":"application/json",
                  "User-Agent":"cherri/1.3.0",
              },
              method="POST",
          )
          opener=build_opener(NoRedirect)
          try:
              resp=opener.open(req, timeout=30)
              status=resp.status
              headers=dict(resp.headers.items())
              out=resp.read()
          except HTTPError as e:
              status=e.code
              headers=dict(e.headers.items())
              out=e.read()
          print("status:",status)
          print("content-type:",headers.get("Content-Type") or headers.get("content-type"))
          print("location:",headers.get("Location") or headers.get("location"))
          print("body-prefix:",repr(out[:300]))
          if status != 200 or out[:4] != b"AEA1":
              raise SystemExit("HubSign response is not a signed shortcut")
          Path("carkit-sign/out/CarKit-Sign-Test.shortcut").write_bytes(out)
          print("signed bytes:", len(out))
          PY
          test "$(xxd -p -l 4 carkit-sign/out/CarKit-Sign-Test.shortcut)" = "41454131"
      - name: Upload signed shortcut
        uses: actions/upload-artifact@v4
        with:
          name: carkit-sign-test
          path: carkit-sign/out/CarKit-Sign-Test.shortcut
          if-no-files-found: error
