name: WebKit Safari QA

on:
  push:
    branches: ["design/codex-premium-skin"]
    paths:
      - "index.html"
      - "assets/styles.css"
      - "assets/app.js"
      - ".github/workflows/webkit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Safari-like WebKit regression
        run: |
          cat > webkit-qa.mjs <<'EOF'
          import { webkit } from 'playwright';
          import fs from 'node:fs';

          const out='webkit-artifacts';
          fs.mkdirSync(out,{recursive:true});
          const results=[];
          const pass=(name,detail='')=>results.push({name,status:'PASS',detail});
          const expect=(cond,name,detail='')=>{
            if(!cond){results.push({name,status:'FAIL',detail}); throw new Error(name+': '+detail)}
            pass(name,detail);
          };

          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:430,height:932},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          });
          const page=await context.newPage();
          await page.addInitScript(()=>{
            window.__opened=[];
            window.open=(url)=>{window.__opened.push(String(url));return null;};
          });
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));

          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForTimeout(300);

          expect(await page.locator('.home-search').isVisible(),'home search visible');
          expect(await page.locator('.core-actions').isVisible(),'core actions visible');
          const road=await page.locator('.road-now').boundingBox();
          expect(road&&road.y<932,'road summary in first viewport',JSON.stringify(road));
          expect(await page.locator('#installSheet').count()===0,'blocking install sheet absent');
          await page.locator('#installBtn').click();
          await page.waitForTimeout(80);
          expect(await page.locator('.sheet').count()===0,'install remains non-blocking');
          expect(pageErrors.length===0,'no page errors after install',pageErrors.join(' | '));
          await page.screenshot({path:out+'/home-430x932-webkit.png',fullPage:false});

          for(const view of ['charging','parking','highway','tunnel','cctv','tools','tesla-db','market','locations','community','partners']){
            await page.locator('.brand').click();
            await page.locator('[data-go="'+view+'"]').first().click();
            await page.waitForTimeout(70);
            expect(await page.locator('[data-view="'+view+'"].active').isVisible(),view+' opens');
          }

          await page.locator('.brand').click();
          await page.locator('[data-go="trip"]').first().click();
          await page.locator('#tripFrom').fill('台南');
          await page.locator('#tripTo').fill('東山');
          await page.locator('#planTripBtn').click();
          expect(await page.locator('#tripResult').textContent().then(t=>t.includes('台南')&&t.includes('東山')),'trip works');

          await page.locator('.brand').click();
          await page.locator('[data-go="tools"]').first().click();
          await page.locator('[data-go="vin"]').click();
          await page.locator('#vinInput').fill('5YJ3E1EA1NF000001');
          await page.locator('#decodeVinBtn').click();
          expect(await page.locator('#vinResult').textContent().then(t=>t.includes('解析結果')),'VIN works');

          await page.locator('[data-view="vin"] .back').click();
          await page.locator('[data-go="calculator"]').click();
          await page.locator('#runCalcBtn').click();
          expect(await page.locator('#calcResult').textContent().then(t=>t.includes('估算結果')),'calculator works');

          await page.locator('.brand').click();
          await page.evaluate(()=>scrollTo(0,document.body.scrollHeight));
          await page.waitForTimeout(100);
          const nav=await page.locator('.bottom-nav').boundingBox();
          const last=await page.locator('.home-more button').last().boundingBox();
          expect(nav&&last&&(last.y+last.height)<=nav.y+2,'bottom nav does not cover last home action',JSON.stringify({nav,last}));

          const topPosition=await page.locator('.topbar').evaluate(el=>getComputedStyle(el).position);
          const navPosition=await page.locator('.bottom-nav').evaluate(el=>getComputedStyle(el).position);
          expect(['sticky','fixed'].includes(topPosition),'topbar sticky/fixed',topPosition);
          expect(navPosition==='fixed','bottom nav fixed',navPosition);

          for(const v of [{name:'390x844',w:390,h:844},{name:'430x932',w:430,h:932}]){
            const p=await browser.newPage({viewport:{width:v.w,height:v.h},isMobile:true,hasTouch:true});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await p.screenshot({path:out+'/home-'+v.name+'.png',fullPage:false});
            const box=await p.locator('.road-now').boundingBox();
            expect(box&&box.y<v.h,'road summary visible start '+v.name,JSON.stringify(box));
            await p.close();
          }

          expect(pageErrors.length===0,'no WebKit page errors',pageErrors.join(' | '));
          fs.writeFileSync(out+'/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          EOF
          node webkit-qa.mjs
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-skin-webkit-qa
          path: webkit-artifacts
          retention-days: 2
