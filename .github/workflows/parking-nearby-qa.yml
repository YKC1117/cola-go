name: Parking Nearby QA

on:
  push:
    branches: ["feature/parking-nearby"]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - "sw.js"
      - ".github/workflows/parking-nearby-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check assets/app.js
          node --check sw.js
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Parking interactions
        run: |
          cat > parking-nearby-qa.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/';
          const out='parking-nearby-artifacts';
          fs.mkdirSync(out,{recursive:true});

          const mock={
            status:'live',
            updatedAt:'2026-09-25T00:20:00+08:00',
            source:'臺南市政府交通局｜測試資料',
            items:[
              {id:'near',name:'近停車場',zone:'永康區',address:'台南市永康區近站路1號',car:3,carTotal:50,green:1,chargeTime:'24H',chargeFee:'每小時30元',sourceUpdate:'2026-09-25 00:20:00',lat:23.0005,lng:120.2205},
              {id:'far',name:'遠停車場',zone:'安平區',address:'台南市安平區遠站路2號',car:50,carTotal:80,green:2,chargeTime:'24H',chargeFee:'每小時40元',sourceUpdate:'2026-09-25 00:20:00',lat:23.0500,lng:120.3000},
              {id:'zero',name:'零車位停車場',zone:'永康區',address:'台南市永康區零位路3號',car:0,carTotal:20,green:0,chargeTime:'24H',chargeFee:'每小時20元',sourceUpdate:'2026-09-25 00:20:00',lat:23.0010,lng:120.2210}
            ]
          };

          async function run(browserType,label,w=430,h=932){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              isMobile:true,
              hasTouch:true,
              serviceWorkers:'block',
              geolocation:{latitude:23.0,longitude:120.22},
              permissions:['geolocation']
            });
            await context.addInitScript(()=>{
              window.__opened=[];
              window.open=(url)=>{window.__opened.push(String(url));return null;};
            });
            await context.route('**/data/parking-live-tainan.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(mock)}));
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="parking"]').first().click();

            if(await page.locator('.parking-card').count()!==3)throw new Error(label+' initial card count');
            const defaultFirst=await page.locator('.parking-card').first().textContent();
            if(!defaultFirst.includes('遠停車場')||!defaultFirst.includes('50'))throw new Error(label+' default availability sort');

            await page.locator('#parkingSortNearest').click();
            await page.waitForFunction(()=>document.querySelector('.parking-card .parking-zone')?.textContent.includes('距離'));
            const nearestFirst=await page.locator('.parking-card').first().textContent();
            if(!nearestFirst.includes('近停車場'))throw new Error(label+' nearest sort');
            if(!nearestFirst.includes('距離'))throw new Error(label+' distance label');
            if((await page.locator('#parkingSortNearest').getAttribute('aria-pressed'))!=='true')throw new Error(label+' nearest pressed state');

            await page.locator('#parkingHasSpaceOnly').click();
            if(await page.locator('.parking-card').count()!==2)throw new Error(label+' has-space filter');
            if((await page.locator('#liveParkingList').textContent()).includes('零車位停車場'))throw new Error(label+' zero-space should be hidden');

            const first=page.locator('.parking-card').first();
            await first.locator('[data-parking-map]').click();
            await first.locator('[data-parking-apple]').click();
            const opened=await page.evaluate(()=>window.__opened);
            if(!opened.some(x=>x.includes('google.com/maps/search')))throw new Error(label+' google nav');
            if(!opened.some(x=>x.includes('maps.apple.com')))throw new Error(label+' apple nav');

            await page.locator('#parkingSortAvailability').click();
            const availabilityFirst=await page.locator('.parking-card').first().textContent();
            if(!availabilityFirst.includes('遠停車場'))throw new Error(label+' availability restore');

            await page.screenshot({path:out+'/parking-'+label+'-'+w+'x'+h+'.png',fullPage:true});
            if(errors.length)throw new Error(label+' page errors '+errors.join(' | '));
            await browser.close();
          }

          async function deniedScenario(){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true,serviceWorkers:'block'});
            await context.route('**/data/parking-live-tainan.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(mock)}));
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="parking"]').first().click();
            await page.locator('#parkingSortNearest').click();
            await page.waitForTimeout(600);
            const pressed=await page.locator('#parkingSortAvailability').getAttribute('aria-pressed');
            if(pressed!=='true')throw new Error('denied location should fall back to availability');
            if(errors.length)throw new Error('denied scenario page errors '+errors.join(' | '));
            await browser.close();
          }

          await run(chromium,'chromium',430,932);
          await run(webkit,'webkit',430,932);
          await run(chromium,'chromium',390,844);
          await deniedScenario();
          console.log('PARKING_NEARBY_QA_SUCCESS');
          EOF
          node parking-nearby-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-nearby-qa
          path: parking-nearby-artifacts
          retention-days: 2
