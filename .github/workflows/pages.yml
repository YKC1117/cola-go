name: Deploy COLA GO to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build signed CarKit TW shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python carkit-sign/build_oil.py
          python carkit-sign/build_tesla.py
          mkdir -p downloads
          python - <<'PY'
          import json, pathlib, urllib.request
          for name in ["油車助手", "特斯拉助手"]:
              src = pathlib.Path("carkit-sign/generated") / (name + ".shortcut.xml")
              payload = json.dumps({"shortcutName": name, "shortcut": src.read_text(encoding="utf-8")}).encode()
              req = urllib.request.Request("https://hubsign.routinehub.services/sign", data=payload, headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"})
              signed = urllib.request.urlopen(req, timeout=60).read()
              if not signed.startswith(b"AEA1"):
                  raise SystemExit(name + ": invalid signed shortcut")
              (pathlib.Path("downloads") / (name + ".shortcut")).write_bytes(signed)
              print(name, len(signed), "AEA1 PASS")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
