name: Deploy COLA GO to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Sync TDX official data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build signed CarKit TW shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python carkit-sign/build_oil.py
          python carkit-sign/build_tesla.py
          mkdir -p downloads
          python - <<'PY'
          import json, pathlib, urllib.request
          expected = {
              "油車助手": ["油車助手｜請選功能", "先不用"],
              "特斯拉助手": ["特斯拉助手｜請選功能", "先不用", "語音控制"],
          }
          for name in ["油車助手", "特斯拉助手"]:
              src = pathlib.Path("carkit-sign/generated") / (name + ".shortcut.xml")
              text = src.read_text(encoding="utf-8")
              for token in expected[name]:
                  if token not in text:
                      raise SystemExit(f"{name}: missing expected token {token!r}")
              if name == "油車助手" and "Oil Driver v" in text:
                  raise SystemExit("油車助手: public version label leaked")
              payload = json.dumps({"shortcutName": name, "shortcut": text}).encode()
              req = urllib.request.Request("https://hubsign.routinehub.services/sign", data=payload, headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"})
              signed = urllib.request.urlopen(req, timeout=60).read()
              if not signed.startswith(b"AEA1"):
                  raise SystemExit(name + ": invalid signed shortcut")
              out_name = {"油車助手":"oil-driver.shortcut","特斯拉助手":"tesla-driver.shortcut"}[name]
              (pathlib.Path("downloads") / out_name).write_bytes(signed)
              print(name, len(signed), "AEA1 PASS")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
