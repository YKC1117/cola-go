name: Verify TDX Credentials

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tdx-credential-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - name: Check secret names exist
        shell: bash
        run: |
          test -n "$TDX_CLIENT_ID" || { echo "::error::TDX_CLIENT_ID is missing"; exit 1; }
          test -n "$TDX_CLIENT_SECRET" || { echo "::error::TDX_CLIENT_SECRET is missing"; exit 1; }

      - name: Verify TDX OAuth and official APIs
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/tdx-token.json --write-out "%{http_code}" \
            --request POST \
            --header "content-type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$TDX_CLIENT_ID" \
            --data-urlencode "client_secret=$TDX_CLIENT_SECRET" \
            "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token")
          test "$code" = "200" || { echo "::error::TDX OAuth returned HTTP $code"; exit 1; }

          TOKEN=$(python3 - <<'PY'
          import json
          with open("/tmp/tdx-token.json", encoding="utf-8") as f:
              data=json.load(f)
          token=data.get("access_token")
          assert token, "TDX response has no access_token"
          print(token)
          PY
          )
          echo "TDX OAuth PASS"

          python3 - "$TOKEN" <<'PY'
          import json, sys, urllib.parse, urllib.request, time
          token=sys.argv[1]
          base="https://tdx.transportdata.tw/api/basic"
          tests=[
            ("parking", "/v1/Parking/OffStreet/CarPark/City/Tainan"),
            ("parking-live", "/v1/Parking/OffStreet/ParkingAvailability/City/Tainan"),
            ("ev-stations", "/v1/EV/Station/City/Tainan"),
            ("freeway-live", "/v2/Road/Traffic/Live/Freeway"),
            ("freeway-cctv", "/v2/Road/Traffic/CCTV/Freeway"),
            ("parking-all", "/v1/Parking/OffStreet/CarPark"),
            ("ev-stations-all", "/v1/EV/Station"),
            ("ev-status-all", "/v1/EV/ConnectorLiveStatus"),
            ("parking-national", "/v1/Parking/OffStreet/CarPark"),
            ("parking-live-national", "/v1/Parking/OffStreet/ParkingAvailability"),
            ("ev-stations-national", "/v1/EV/Station"),
            ("ev-live-national", "/v1/EV/ConnectorLiveStatus"),
          ]
          for idx,(name,path) in enumerate(tests):
              if idx: time.sleep(13)
              query=urllib.parse.urlencode({"$format":"JSON","$top":"1"})
              req=urllib.request.Request(base+path+"?"+query,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "User-Agent":"COLA-GO/1.0",
              })
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      payload=json.load(r)
                  if isinstance(payload,list):
                      count=len(payload)
                  elif isinstance(payload,dict):
                      arrays=[v for v in payload.values() if isinstance(v,list)]
                      count=len(arrays[0]) if arrays else -1
                  else:
                      count=-1
                  if count < 0:
                      raise RuntimeError("unexpected JSON container")
                  print(f"{name}: PASS ({count} sample item)")
              except Exception as exc:
                  print(f"::error::{name}: {type(exc).__name__}: {exc}")
                  raise
          PY
