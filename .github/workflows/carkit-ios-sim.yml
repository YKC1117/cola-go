name: CarKit iOS Simulator Probe

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - ".github/workflows/carkit-ios-sim.yml"

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign current shortcuts
        run: |
          set -euxo pipefail
          rm -rf carkit-sign/generated carkit-sign/out
          python3 carkit-sign/build_oil.py
          python3 carkit-sign/build_tesla.py
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          for p in sorted(Path("carkit-sign/generated").glob("*.shortcut.xml")):
              name=p.name.removesuffix(".shortcut.xml")
              payload=json.dumps({
                  "shortcutName":name,
                  "shortcut":p.read_text(encoding="utf-8")
              }).encode()
              req=Request(
                  "https://hubsign.routinehub.services/sign",
                  data=payload,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"},
                  method="POST",
              )
              with urlopen(req,timeout=60) as resp:
                  signed=resp.read()
              if signed[:4] != b"AEA1":
                  raise SystemExit(f"{name}: invalid signed header")
              (Path("carkit-sign/out")/f"{name}.shortcut").write_bytes(signed)
              print(name,len(signed),signed[:4])
          PY

      - name: Boot newest iPhone simulator
        id: sim
        run: |
          set -euxo pipefail
          UDID="$(python3 - <<'PY'
          import json, re, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data["devices"].items():
              m=re.search(r"iOS-(\d+)-(\d+)",runtime)
              if not m:
                  continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name",""):
                      rank=0 if "Pro Max" in d["name"] else 1
                      candidates.append((version,-rank,d["name"],d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl listapps "$UDID" > /tmp/listapps.txt
          grep -q "com.apple.shortcuts" /tmp/listapps.txt
          echo "SHORTCUTS_APP_PRESENT=1"

      - name: Probe direct signed shortcut file opening
        run: |
          set -euxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p /tmp/carkit-probe

          DEVICE_ROOT="$(xcrun simctl getenv "$UDID" HOME | sed 's#/data$##' || true)"
          SHORTCUTS_DATA="$(xcrun simctl get_app_container "$UDID" com.apple.shortcuts data)"
          echo "DEVICE_ROOT=$DEVICE_ROOT" | tee /tmp/carkit-probe/paths.txt
          echo "SHORTCUTS_DATA=$SHORTCUTS_DATA" | tee -a /tmp/carkit-probe/paths.txt

          mkdir -p "$SHORTCUTS_DATA/Documents/CarKitTW"
          cp carkit-sign/out/*.shortcut "$SHORTCUTS_DATA/Documents/CarKitTW/"
          ls -l "$SHORTCUTS_DATA/Documents/CarKitTW" | tee -a /tmp/carkit-probe/paths.txt

          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2

          # Route A: direct host-backed simulator sandbox file URL.
          OIL_PATH="$SHORTCUTS_DATA/Documents/CarKitTW/油車助手.shortcut"
          echo "Route A Oil: file://$OIL_PATH" | tee -a /tmp/carkit-probe/paths.txt
          xcrun simctl openurl "$UDID" "file://$OIL_PATH" || true
          sleep 5
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-direct-file.png

          xcrun simctl terminate "$UDID" com.apple.shortcuts || true
          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2

          TESLA_PATH="$SHORTCUTS_DATA/Documents/CarKitTW/特斯拉助手.shortcut"
          echo "Route A Tesla: file://$TESLA_PATH" | tee -a /tmp/carkit-probe/paths.txt
          xcrun simctl openurl "$UDID" "file://$TESLA_PATH" || true
          sleep 5
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-direct-file.png

          # Route B: ask the simulator's document interaction system to open a
          # percent-encoded file URL pointing at a file already inside the
          # Shortcuts sandbox. This gives us a separate attempt/evidence point.
          python3 - "$OIL_PATH" "$TESLA_PATH" > /tmp/carkit-probe/file-urls.txt <<'PY'
          import sys
          from pathlib import Path
          for p in sys.argv[1:]:
              print(Path(p).as_uri())
          PY

          xcrun simctl spawn "$UDID" log show --last 3m --style compact             --predicate 'process == "Shortcuts" OR subsystem CONTAINS[c] "workflow"'             > /tmp/carkit-probe/shortcuts.log || true

          ls -lh /tmp/carkit-probe

      - name: Upload simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: carkit-ios-simulator-direct-file-probe
          path: /tmp/carkit-probe/
          if-no-files-found: error
