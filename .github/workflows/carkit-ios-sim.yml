name: CarKit iOS Simulator Probe

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - ".github/workflows/carkit-ios-sim.yml"

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign current shortcuts
        run: |
          set -euxo pipefail
          rm -rf carkit-sign/generated carkit-sign/out
          python3 carkit-sign/build_oil.py
          python3 carkit-sign/build_tesla.py
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          for p in sorted(Path("carkit-sign/generated").glob("*.shortcut.xml")):
              name=p.name.removesuffix(".shortcut.xml")
              payload=json.dumps({
                  "shortcutName":name,
                  "shortcut":p.read_text(encoding="utf-8")
              }).encode()
              req=Request(
                  "https://hubsign.routinehub.services/sign",
                  data=payload,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"},
                  method="POST",
              )
              with urlopen(req,timeout=60) as resp:
                  signed=resp.read()
              if signed[:4] != b"AEA1":
                  raise SystemExit(f"{name}: invalid signed header")
              (Path("carkit-sign/out")/f"{name}.shortcut").write_bytes(signed)
              print(name,len(signed),signed[:4])
          PY

      - name: Boot newest iPhone simulator
        id: sim
        run: |
          set -euxo pipefail
          xcodebuild -version
          UDID="$(python3 - <<'PY'
          import json, re, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data["devices"].items():
              m=re.search(r"iOS-(\d+)-(\d+)",runtime)
              if not m:
                  continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name",""):
                      rank=0 if "Pro Max" in d["name"] else 1
                      candidates.append((version, -rank, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl listapps "$UDID" > /tmp/listapps.txt
          grep -q "com.apple.shortcuts" /tmp/listapps.txt
          echo "SHORTCUTS_APP_PRESENT=1"

      - name: Probe signed shortcut import URLs
        run: |
          set -euxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p /tmp/carkit-probe
          python3 -m http.server 8765 --bind 127.0.0.1 --directory carkit-sign/out >/tmp/carkit-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2

          curl -fsS "http://127.0.0.1:8765/" >/tmp/carkit-index.html

          import_url() {
            python3 - "$1" <<'PY'
          import sys
          from urllib.parse import quote
          url="http://127.0.0.1:8765/"+quote(sys.argv[1])
          print("shortcuts://import-shortcut/?url="+quote(url,safe=""))
          PY
          }

          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2

          OIL_URL="$(import_url "油車助手.shortcut")"
          echo "Opening Oil import URL"
          xcrun simctl openurl "$UDID" "$OIL_URL"
          sleep 6
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-import.png

          xcrun simctl terminate "$UDID" com.apple.shortcuts || true
          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2

          TESLA_URL="$(import_url "特斯拉助手.shortcut")"
          echo "Opening Tesla import URL"
          xcrun simctl openurl "$UDID" "$TESLA_URL"
          sleep 6
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-import.png

          xcrun simctl spawn "$UDID" log show --last 3m --style compact             --predicate 'process == "Shortcuts"' > /tmp/carkit-probe/shortcuts.log || true
          cp /tmp/carkit-http.log /tmp/carkit-probe/http.log
          ls -lh /tmp/carkit-probe

      - name: Upload simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: carkit-ios-simulator-import-probe
          path: /tmp/carkit-probe/
          if-no-files-found: error
