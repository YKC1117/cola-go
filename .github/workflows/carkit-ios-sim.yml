name: CarKit iOS Simulator Probe

concurrency:
  group: carkit-ios-sim-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - temp/carkit-shortcut-sign
    paths:
      - "carkit-sign/**"
      - ".github/workflows/carkit-ios-sim.yml"

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign current shortcuts
        run: |
          set -euxo pipefail
          rm -rf carkit-sign/generated carkit-sign/out
          python3 carkit-sign/build_oil.py
          python3 carkit-sign/build_tesla.py
          mkdir -p carkit-sign/out
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          for p in sorted(Path("carkit-sign/generated").glob("*.shortcut.xml")):
              name=p.name.removesuffix(".shortcut.xml")
              payload=json.dumps({
                  "shortcutName":name,
                  "shortcut":p.read_text(encoding="utf-8")
              }).encode()
              req=Request(
                  "https://hubsign.routinehub.services/sign",
                  data=payload,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/1.3.0"},
                  method="POST",
              )
              with urlopen(req,timeout=60) as resp:
                  signed=resp.read()
              if signed[:4] != b"AEA1":
                  raise SystemExit(f"{name}: invalid signed header")
              (Path("carkit-sign/out")/f"{name}.shortcut").write_bytes(signed)
              print(name,len(signed),signed[:4])
          PY

      - name: Boot newest iPhone simulator
        id: sim
        run: |
          set -euxo pipefail
          UDID="$(python3 - <<'PY'
          import json, re, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data["devices"].items():
              m=re.search(r"iOS-(\d+)-(\d+)",runtime)
              if not m:
                  continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name",""):
                      rank=0 if "Pro Max" in d["name"] else 1
                      candidates.append((version,-rank,d["name"],d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl listapps "$UDID" > /tmp/listapps.txt
          grep -q "com.apple.shortcuts" /tmp/listapps.txt
          echo "SHORTCUTS_APP_PRESENT=1"

      - name: Install simulator UI driver
        run: |
          set -euxo pipefail
          brew tap facebook/fb
          brew trust facebook/fb
          brew install facebook/fb/idb
          idb list-targets

      - name: Probe direct signed shortcut install flow
        timeout-minutes: 8
        run: |
          set -euxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          run_idb() {
            python3 -c 'import subprocess,sys; cmd=sys.argv[1:]; print("RUN_IDB "+repr(cmd),file=sys.stderr,flush=True); p=subprocess.run(cmd,timeout=35); raise SystemExit(p.returncode)' "$@"
          }
          describe_retry() {
            local out="$1"; shift
            rm -f "$out"
            for attempt in 1 2 3 4 5 6; do
              if run_idb idb ui describe-all --key AXLabel --key frame --udid "$UDID" > "$out" && test -s "$out"; then
                python3 -m json.tool "$out" >/dev/null && return 0
              fi
              echo "UI describe attempt $attempt not ready: $out"
              sleep 2
            done
            echo "Required UI evidence unavailable: $out" >&2
            return 1
          }

          open_file_retry() {
            local path="$1"
            for attempt in 1 2 3; do
              xcrun simctl launch "$UDID" com.apple.shortcuts || true
              sleep 2
              if xcrun simctl openurl "$UDID" "file://$path"; then
                sleep 4
                return 0
              fi
              echo "file open attempt $attempt failed: $path"
              sleep 2
            done
            return 1
          }

          tap_frame_label() {
            local json_file="$1"
            local label="$2"
            local xy
            xy="$(jq -r --arg l "$label" '[.. | objects | select(.AXLabel == $l and (.frame|type) == "object") | [((.frame.x + (.frame.width/2))|round), ((.frame.y + (.frame.height/2))|round)]][0] | @tsv' "$json_file")"
            test -n "$xy"
            read -r x y <<< "$xy"
            echo "tap $label at $x,$y"
            run_idb idb ui tap "$x" "$y" --udid "$UDID"
          }

          mkdir -p /tmp/carkit-probe
          git rev-parse HEAD > /tmp/carkit-probe/commit.txt
          xcrun simctl list runtimes > /tmp/carkit-probe/simulator-runtimes.txt
          xcrun simctl list devices > /tmp/carkit-probe/simulator-devices.txt
          shasum -a 256 carkit-sign/out/*.shortcut > /tmp/carkit-probe/signed-sha256.txt
          if xcrun simctl listapps "$UDID" > /tmp/carkit-probe/app-inventory.txt; then
            echo "APP_INVENTORY_QUERY=PASS" > /tmp/carkit-probe/app-inventory-status.txt
            if grep -q 'com.teslamotors.TeslaApp' /tmp/carkit-probe/app-inventory.txt; then
              echo "TESLA_APP_PRESENT=1" >> /tmp/carkit-probe/app-inventory-status.txt
            else
              echo "TESLA_APP_PRESENT=0" >> /tmp/carkit-probe/app-inventory-status.txt
            fi
          else
            echo "APP_INVENTORY_QUERY=FAIL" > /tmp/carkit-probe/app-inventory-status.txt
            echo "TESLA_APP_PRESENT=UNKNOWN" >> /tmp/carkit-probe/app-inventory-status.txt
          fi
          echo "TARGET_UDID=$UDID" | tee /tmp/carkit-probe/target.txt
          idb list-targets | tee /tmp/carkit-probe/idb-targets.txt || true
          command -v idb_companion | tee /tmp/carkit-probe/idb-companion-path.txt || true

          SHORTCUTS_DATA="$(xcrun simctl get_app_container "$UDID" com.apple.shortcuts data)"
          echo "SHORTCUTS_DATA=$SHORTCUTS_DATA" | tee /tmp/carkit-probe/paths.txt
          mkdir -p "$SHORTCUTS_DATA/Documents/CarKitTW"
          cp carkit-sign/out/*.shortcut "$SHORTCUTS_DATA/Documents/CarKitTW/"

          OIL_PATH="$SHORTCUTS_DATA/Documents/CarKitTW/油車助手.shortcut"
          TESLA_PATH="$SHORTCUTS_DATA/Documents/CarKitTW/特斯拉助手.shortcut"

          # Oil: direct file must open a real Add Shortcut sheet.
          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2
          open_file_retry "$OIL_PATH"
          describe_retry /tmp/carkit-probe/oil-before.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-before.png
          tap_frame_label /tmp/carkit-probe/oil-before.json "Add Shortcut"
          sleep 6
          describe_retry /tmp/carkit-probe/oil-after-add.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-after-add.png

          # Confirm Oil exists in the library/editor by asking Shortcuts to open it.
          xcrun simctl openurl "$UDID" "shortcuts://open-shortcut?name=%E6%B2%B9%E8%BB%8A%E5%8A%A9%E6%89%8B" || true
          sleep 5
          describe_retry /tmp/carkit-probe/oil-opened.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-opened.png

          # Tesla: direct file, tap Add Shortcut, then inspect setup/import questions.
          xcrun simctl terminate "$UDID" com.apple.shortcuts || true
          xcrun simctl launch "$UDID" com.apple.shortcuts || true
          sleep 2
          open_file_retry "$TESLA_PATH"
          describe_retry /tmp/carkit-probe/tesla-before.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-before.png
          tap_frame_label /tmp/carkit-probe/tesla-before.json "Add Shortcut"
          sleep 6
          describe_retry /tmp/carkit-probe/tesla-after-add.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-after-add.png

          # Re-open Tesla by its own name so the import proof cannot accidentally
          # be satisfied by the previously imported Oil shortcut.
          xcrun simctl openurl "$UDID" "shortcuts://open-shortcut?name=%E7%89%B9%E6%96%AF%E6%8B%89%E5%8A%A9%E6%89%8B"
          sleep 5
          describe_retry /tmp/carkit-probe/tesla-opened.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-opened.png

          echo "=== OIL BEFORE LABELS ==="
          cat /tmp/carkit-probe/oil-before.json || true
          echo "=== OIL AFTER LABELS ==="
          cat /tmp/carkit-probe/oil-after-add.json || true
          echo "=== TESLA AFTER LABELS ==="
          cat /tmp/carkit-probe/tesla-after-add.json || true
          ls -lh /tmp/carkit-probe

      - name: Validate simulator import evidence
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/carkit-probe")
          required_json=[
              "oil-before.json","oil-after-add.json","oil-opened.json",
              "tesla-before.json","tesla-after-add.json","tesla-opened.json",
          ]
          required_png=[
              "oil-before.png","oil-after-add.png","oil-opened.png",
              "tesla-before.png","tesla-after-add.png","tesla-opened.png",
          ]
          def labels(name):
              p=root/name
              assert p.stat().st_size>0, f"{name}: empty evidence"
              data=json.loads(p.read_text())
              out=[]
              def walk(v):
                  if isinstance(v,dict):
                      x=v.get("AXLabel")
                      if isinstance(x,str): out.append(x)
                      for y in v.values(): walk(y)
                  elif isinstance(v,list):
                      for y in v: walk(y)
              walk(data)
              return out
          for name in required_png:
              assert (root/name).stat().st_size>0, f"{name}: missing screenshot"
          oil_before=labels("oil-before.json")
          oil_after=labels("oil-after-add.json")
          oil_opened=labels("oil-opened.json")
          tesla_before=labels("tesla-before.json")
          tesla_after=labels("tesla-after-add.json")
          tesla_opened=labels("tesla-opened.json")
          assert "Add Shortcut" in oil_before, oil_before
          assert "油車助手" in oil_before, oil_before
          # iOS 26.x does not always expose the "Search Actions" field in
          # the accessibility tree. Prove the native editor by requiring the
          # shortcut's own top-level menu action plus the editor Play control.
          def editor_open(labels,prompt):
              return (
                  "play" in labels
                  and any(prompt in x for x in labels if isinstance(x,str))
              )
          assert editor_open(oil_after,"油車助手｜請選功能"), oil_after
          assert editor_open(oil_opened,"油車助手｜請選功能"), oil_opened
          # Tesla's pre-import accessibility tree can transiently expose
          # only the Shortcuts root even while the native Add Shortcut sheet is
          # visibly present. The post-add editor and independent reopen are the
          # real gates.
          assert editor_open(tesla_after,"特斯拉助手｜請選功能"), tesla_after
          assert editor_open(tesla_opened,"特斯拉助手｜請選功能"), tesla_opened
          for name in required_json:
              json.loads((root/name).read_text())
          PY
          test -s /tmp/carkit-probe/commit.txt
          test -s /tmp/carkit-probe/signed-sha256.txt
          test -s /tmp/carkit-probe/app-inventory-status.txt
          echo "OIL_SIMULATOR_IMPORT=PASS"
          echo "TESLA_SIMULATOR_IMPORT=PASS"
          echo "TESLA_APPINTENT_RUNTIME=NOT_RUN"
          echo "TESLA_VEHICLE_ENTITY_PICKER=NOT_RUN"
          echo "REQUIRES_PHYSICAL_IPHONE_AND_TESLA_APP=1"

      - name: Validate editor-run main menu
        timeout-minutes: 4
        run: |
          set -euxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          run_idb() {
            python3 -c 'import subprocess,sys; cmd=sys.argv[1:]; print("RUN_IDB "+repr(cmd),file=sys.stderr,flush=True); p=subprocess.run(cmd,timeout=30); raise SystemExit(p.returncode)' "$@"
          }
          describe_retry() {
            local out="$1"
            rm -f "$out"
            for attempt in 1 2 3 4 5 6; do
              if run_idb idb ui describe-all --key AXLabel --key AXValue --key AXUniqueId --key frame --udid "$UDID" > "$out" && test -s "$out"; then
                python3 -m json.tool "$out" >/dev/null && return 0
              fi
              echo "UI describe attempt $attempt not ready: $out"
              sleep 2
            done
            return 1
          }
          open_shortcut_retry() {
            local encoded_name="$1"
            for attempt in 1 2 3; do
              xcrun simctl launch "$UDID" com.apple.shortcuts || true
              sleep 2
              if xcrun simctl openurl "$UDID" "shortcuts://open-shortcut?name=$encoded_name"; then
                sleep 4
                return 0
              fi
              echo "open-shortcut attempt $attempt failed; retrying"
              sleep 2
            done
            return 1
          }
          assert_menu() {
            local file="$1"
            local kind="$2"
            python3 - "$file" "$kind" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          kind=sys.argv[2]
          labels=[]
          def walk(v):
              if isinstance(v,dict):
                  for key in ("AXLabel","AXValue"):
                      x=v.get(key)
                      if isinstance(x,str):
                          labels.append(x)
                  for x in v.values():
                      walk(x)
              elif isinstance(v,list):
                  for x in v:
                      walk(x)
          walk(data)
          if kind=="tesla":
              required_any=["特斯拉助手","準備出發","空調 / 車室","充電"]
          else:
              required_any=["油車助手","神盾","導航","路況"]
          if not any(any(token in x for token in required_any) for x in labels):
              raise SystemExit("main menu not observed: "+repr(labels[:160]))
          print(kind.upper()+"_MAIN_MENU_OBSERVED=1")
          PY
          }

          # Tesla: run from the native editor's Play button and prove the
          # touch-first main menu appears before any Tesla AppIntent executes.
          open_shortcut_retry "%E7%89%B9%E6%96%AF%E6%8B%89%E5%8A%A9%E6%89%8B"
          run_idb idb ui tap "play" --udid "$UDID"
          sleep 3
          describe_retry /tmp/carkit-probe/tesla-play-menu.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-play-menu.png
          assert_menu /tmp/carkit-probe/tesla-play-menu.json tesla

          # Oil: independently prove the same menu-first interaction.
          open_shortcut_retry "%E6%B2%B9%E8%BB%8A%E5%8A%A9%E6%89%8B"
          run_idb idb ui tap "play" --udid "$UDID"
          sleep 3
          describe_retry /tmp/carkit-probe/oil-play-menu.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-play-menu.png
          assert_menu /tmp/carkit-probe/oil-play-menu.json oil

          echo "TESLA_EDITOR_RUN_MENU=PASS"
          echo "OIL_EDITOR_RUN_MENU=PASS"
          echo "SIRI_VOICE_DIALOG=NOT_RUN"

      - name: Validate Oil runtime navigation prompt
        timeout-minutes: 3
        run: |
          set -euxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          run_idb() {
            python3 -c 'import subprocess,sys; cmd=sys.argv[1:]; print("RUN_IDB "+repr(cmd),file=sys.stderr,flush=True); p=subprocess.run(cmd,timeout=30); raise SystemExit(p.returncode)' "$@"
          }
          open_shortcut_retry_nav() {
            local encoded_name="$1"
            for attempt in 1 2 3; do
              xcrun simctl launch "$UDID" com.apple.shortcuts || true
              sleep 2
              if xcrun simctl openurl "$UDID" "shortcuts://open-shortcut?name=$encoded_name"; then
                sleep 4
                return 0
              fi
              echo "navigation open-shortcut attempt $attempt failed; retrying"
              sleep 2
            done
            return 1
          }
          describe_retry() {
            local out="$1"
            rm -f "$out"
            for attempt in 1 2 3 4 5 6; do
              if run_idb idb ui describe-all --key AXLabel --key AXValue --key AXUniqueId --key frame --udid "$UDID" > "$out" && test -s "$out"; then
                python3 -m json.tool "$out" >/dev/null && return 0
              fi
              sleep 2
            done
            return 1
          }

          tap_frame_nav() {
            local json_file="$1"
            local label="$2"
            local xy
            xy="$(jq -r --arg l "$label" '[.. | objects | select(.AXLabel == $l and (.frame|type) == "object") | [((.frame.x + (.frame.width/2))|round), ((.frame.y + (.frame.height/2))|round)]][0] | @tsv' "$json_file")"
            test -n "$xy"
            read -r x y <<< "$xy"
            echo "tap $label at $x,$y"
            run_idb idb ui tap "$x" "$y" --udid "$UDID"
          }

          # Prove the new navigation path reaches a real runtime destination
          # prompt instead of a missing-parameter sheet.
          open_shortcut_retry_nav "%E6%B2%B9%E8%BB%8A%E5%8A%A9%E6%89%8B"
          run_idb idb ui tap "play" --udid "$UDID"
          sleep 2
          describe_retry /tmp/carkit-probe/oil-nav-main-menu.json
          tap_frame_nav /tmp/carkit-probe/oil-nav-main-menu.json "導航"
          sleep 1
          describe_retry /tmp/carkit-probe/oil-nav-app-menu.json
          tap_frame_nav /tmp/carkit-probe/oil-nav-app-menu.json "Apple 地圖"
          sleep 2
          describe_retry /tmp/carkit-probe/oil-navigation-prompt.json
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/oil-navigation-prompt.png

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/carkit-probe/oil-navigation-prompt.json")
          data=json.loads(p.read_text())
          values=[]
          def walk(v):
              if isinstance(v,dict):
                  for key in ("AXLabel","AXValue"):
                      x=v.get(key)
                      if isinstance(x,str):
                          values.append(x)
                  for x in v.values():
                      walk(x)
              elif isinstance(v,list):
                  for x in v:
                      walk(x)
          walk(data)
          assert any("要去哪裡" in x for x in values), values[:180]
          assert not any("請選擇此動作中每個參數的值" in x for x in values), values[:180]
          assert not any("Please choose a value for each parameter" in x for x in values), values[:180]
          print("OIL_RUNTIME_NAVIGATION_PROMPT=PASS")
          PY
          xcrun simctl terminate "$UDID" com.apple.shortcuts || true

      - name: Best-effort Tesla runtime diagnostics
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -uxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          run_idb() {
            python3 -c 'import subprocess,sys; cmd=sys.argv[1:]; print("RUN_IDB "+repr(cmd),file=sys.stderr,flush=True); p=subprocess.run(cmd,timeout=25); raise SystemExit(p.returncode)' "$@"
          }
          xcrun simctl openurl "$UDID" "shortcuts://run-shortcut?name=%E7%89%B9%E6%96%AF%E6%8B%89%E5%8A%A9%E6%89%8B" || true
          sleep 5
          run_idb idb ui describe-all --key AXLabel --key AXValue --key AXUniqueId --key frame --udid "$UDID" > /tmp/carkit-probe/tesla-runtime-prompt.json || true
          xcrun simctl io "$UDID" screenshot /tmp/carkit-probe/tesla-runtime-prompt.png || true
          xcrun simctl spawn "$UDID" log show --last 4m --style compact --predicate 'process == "Shortcuts" OR subsystem CONTAINS[c] "workflow"' > /tmp/carkit-probe/shortcuts.log || true
          if grep -Eq '特斯拉助手|準備出發|空調 / 車室|充電' /tmp/carkit-probe/tesla-runtime-prompt.json 2>/dev/null; then
            echo "TESLA_ENTRY_MENU_OBSERVED=1"
          else
            echo "TESLA_ENTRY_MENU_OBSERVED=0"
          fi
          echo "Tesla AppIntent runtime remains NOT RUN: stock Simulator cannot establish real Tesla App/AppEntity behavior."

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carkit-ios-simulator-install-flow-v1.1
          path: /tmp/carkit-probe/
          if-no-files-found: warn
