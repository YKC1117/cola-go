name: Probe TDX EV schema once

on:
  push:
    branches: ["probe/tdx-ev-schema-20260928"]
    paths:
      - ".github/workflows/probe-tdx-ev-schema.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - name: Probe sanitized EV station details and operator endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          token_url="https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token"
          body=urllib.parse.urlencode({
              "grant_type":"client_credentials",
              "client_id":os.environ["TDX_CLIENT_ID"],
              "client_secret":os.environ["TDX_CLIENT_SECRET"],
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(token_url,data=body,headers={"content-type":"application/x-www-form-urlencoded"}),timeout=30) as r:
              token=json.load(r)["access_token"]

          base="https://tdx.transportdata.tw/api/basic"
          headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"COLA-GO-schema-probe/1.0"}

          def get(path,top):
              q=urllib.parse.urlencode({"$format":"JSON","$top":str(top)})
              with urllib.request.urlopen(urllib.request.Request(base+path+"?"+q,headers=headers),timeout=30) as r:
                  p=json.load(r)
              return p if isinstance(p,list) else next((v for v in p.values() if isinstance(v,list)),[])

          rows=get("/v1/EV/Station/City/Tainan",2)
          print("=== Station detail ===")
          for i,row in enumerate(rows,1):
              safe={k:row.get(k) for k in [
                  "StationID","StationName","Description","OperatorID","OperationType","PositionLat","PositionLon",
                  "Spaces","ChargingPoints","Connectors","Location","ServiceTime","ParkingRate","ChargingRate",
                  "Telephone","Reference"
              ] if k in row}
              print("ROW",i,json.dumps(safe,ensure_ascii=False,sort_keys=True))

          time.sleep(13)
          print("=== Operator endpoint ===")
          for path in ["/v1/EV/Operator","/v1/EV/Operator/City/Tainan"]:
              try:
                  operators=get(path,20)
                  print("PATH",path,"COUNT",len(operators))
                  for row in operators[:20]:
                      safe={k:row.get(k) for k in ["OperatorID","OperatorName","Telephone","Address","WebURL","BAN"] if k in row}
                      print("OP",json.dumps(safe,ensure_ascii=False,sort_keys=True))
                  break
              except urllib.error.HTTPError as e:
                  print("PATH",path,"HTTP",e.code)
          PY
