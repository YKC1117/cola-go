name: Sync TDX official data

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/sync_tdx.py"
      - ".github/workflows/sync-tdx-data.yml"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Refresh static parking and charging datasets"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: cola-go-tdx-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      TDX_BOOTSTRAP: ${{ (github.event_name == 'workflow_dispatch' && inputs.bootstrap) && '1' || '0' }}
      TDX_MIN_INTERVAL: "13"
    steps:
      - uses: actions/checkout@v4
      - name: Sync protected TDX data cache
        run: python3 scripts/sync_tdx.py
      - name: Commit refreshed official cache
        run: |
          git config user.name "COLA GO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tdx/
          if git diff --cached --quiet; then
            echo "No TDX data changes."
            exit 0
          fi
          git commit -m "data: refresh TDX official cache"
          git pull --rebase origin main
          git push
