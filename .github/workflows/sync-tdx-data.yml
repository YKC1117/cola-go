name: Sync TDX official data

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/sync_tdx.py"
      - "assets/tdx-runtime.js"
      - "assets/app.js"
      - ".github/workflows/sync-tdx-data.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "TDX sync mode"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - dynamic
          - static
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "43 2 * * *"

permissions:
  contents: write

concurrency:
  group: cola-go-tdx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      TDX_MIN_INTERVAL: "13"
    steps:
      - uses: actions/checkout@v4
      - name: Select sync mode
        shell: bash
        run: |
          set -euo pipefail
          mode="all"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "43 2 * * *" ]]; then
              mode="static"
            else
              mode="dynamic"
            fi
          fi
          echo "TDX_SYNC_MODE=$mode" >> "$GITHUB_ENV"
          echo "TDX sync mode: $mode"
      - name: Sync protected TDX data cache
        run: python3 scripts/sync_tdx.py
      - name: Commit refreshed official cache
        run: |
          set -euo pipefail
          git config user.name "COLA GO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tdx/
          if git diff --cached --quiet; then
            echo "No TDX data changes."
            exit 0
          fi
          git commit -m "data: refresh TDX official cache"
          git pull --rebase origin main
          git push
