name: Charging Core QA

on:
  push:
    branches: ["feature/charging-core"]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - "sw.js"
      - ".github/workflows/charging-core-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check assets/app.js
          node --check sw.js
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Charging interactions
        run: |
          cat > charging-qa.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/';
          const out='charging-qa-artifacts';
          fs.mkdirSync(out,{recursive:true});

          async function run(browserType,label,w,h){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              isMobile:w<600,
              hasTouch:w<600,
              serviceWorkers:'block'
            });
            await context.addInitScript(()=>{
              localStorage.clear();
              window.__opened=[];
              window.open=(url)=>{window.__opened.push(String(url));return null;};
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="charging"]').first().click();
            await page.waitForTimeout(100);

            if(!(await page.locator('[data-view="charging"].active').isVisible()))throw new Error(label+' charging page not open');
            if(await page.locator('.charging-item').count()<10)throw new Error(label+' initial station count too low');

            await page.locator('#chargingConnector').selectOption('CCS2');
            await page.locator('#chargingPower').selectOption('350');
            await page.locator('#chargingOperator').selectOption('iCharging');
            await page.locator('#chargingDirection').selectOption('south');
            const filtered=await page.locator('.charging-item').count();
            if(filtered<1)throw new Error(label+' filters returned zero');

            const card=page.locator('.charging-item').first();
            const cardText=await card.textContent();
            if(!cardText.includes('CCS2')||!cardText.includes('非即時空槍'))throw new Error(label+' card status/spec missing');

            await card.locator('[data-charge-favorite]').click();
            if(!((await page.locator('#chargingFavoriteCount').textContent())==='1'))throw new Error(label+' favorite count');
            if(!(await page.locator('[data-charge-favorite]').first().getAttribute('aria-pressed')).includes('true'))throw new Error(label+' favorite state');
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('cola-go-charging-favorites')||'[]').length);
            if(saved!==1)throw new Error(label+' favorite persistence');

            await page.locator('#chargingFavoritesOnly').click();
            if(await page.locator('.charging-item').count()!==1)throw new Error(label+' favorites only filter');

            await page.locator('#resetChargingFilters').click();
            if((await page.locator('#chargingFavoritesOnly').getAttribute('aria-pressed'))!=='false')throw new Error(label+' reset favorite-only');
            if(await page.locator('.charging-item').count()<10)throw new Error(label+' reset station list');

            await page.locator('#roadFilter [data-road="3"]').click();
            await page.locator('#chargingSearch').fill('東山');
            if(await page.locator('.charging-item').count()!==1)throw new Error(label+' road/search filter');
            const east=page.locator('.charging-item').first();
            if(!(await east.textContent()).includes('東山服務區'))throw new Error(label+' search result wrong');

            await east.locator('[data-charge-google]').click();
            await east.locator('[data-charge-apple]').click();
            const opened=await page.evaluate(()=>window.__opened);
            if(!opened.some(x=>x.includes('google.com/maps/search')))throw new Error(label+' google station nav');
            if(!opened.some(x=>x.includes('maps.apple.com')))throw new Error(label+' apple station nav');

            await page.locator('#nearbyGoogle').click();
            await page.locator('#nearbyApple').click();
            const opened2=await page.evaluate(()=>window.__opened);
            if(opened2.filter(x=>x.includes('google.com/maps/search')).length<2)throw new Error(label+' nearby google');
            if(opened2.filter(x=>x.includes('maps.apple.com')).length<2)throw new Error(label+' nearby apple');

            await page.locator('#chargingSearch').fill('');
            await page.locator('#roadFilter [data-road="3"]').click();
            const camera=page.locator('[data-camera-road]').first();
            await camera.click();
            if(!(await page.locator('[data-view="cctv"].active').isVisible()))throw new Error(label+' CCTV open');
            if(!(await page.locator('#cctvRoadFilter [data-cctv-road="3"]').getAttribute('class')||'').includes('active'))throw new Error(label+' CCTV road scope');

            await page.locator('.brand').click();
            await page.locator('[data-go="charging"]').first().click();
            await page.screenshot({path:out+'/charging-'+label+'-'+w+'x'+h+'.png',fullPage:true});

            if(errors.length)throw new Error(label+' page errors '+errors.join(' | '));
            await browser.close();
          }

          await run(chromium,'chromium',430,932);
          await run(webkit,'webkit',430,932);
          await run(chromium,'chromium',390,844);
          console.log('CHARGING_CORE_QA_SUCCESS');
          EOF
          node charging-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charging-core-qa
          path: charging-qa-artifacts
          retention-days: 2
