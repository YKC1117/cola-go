name: New Taipei parking source smoke

on:
  push:
    branches: ["feature/parking-newtaipei-live"]
    paths: [".github/workflows/newtaipei-parking-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and join official New Taipei parking CSVs
        run: |
          python3 - <<'PY'
          import csv, io, json, urllib.request

          STATIC="https://data.ntpc.gov.tw/api/datasets/b1464ef0-9c7c-4a6f-abf7-6bdf32847e68/csv/file"
          LIVE="https://data.ntpc.gov.tw/api/datasets/e09b35a5-a738-48cc-b0f5-570b67ad9c78/csv/file"

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"COLA-GO/1.0","Accept":"text/csv,application/json,text/plain,*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  info={
                      "status":getattr(r,"status",None),
                      "url":r.geturl(),
                      "content_type":r.headers.get("Content-Type"),
                      "content_encoding":r.headers.get("Content-Encoding"),
                      "charset":r.headers.get_content_charset(),
                      "length":len(raw),
                  }
              print("HTTP_INFO",json.dumps(info,ensure_ascii=False))
              print("RAW_HEX",raw[:80].hex())
              print("RAW_REPR",repr(raw[:300]))
              if raw[:2]==b"\x1f\x8b":
                  import gzip
                  raw=gzip.decompress(raw)
                  print("GZIP_DECOMPRESSED",len(raw))
              stripped=raw.lstrip()
              if stripped.startswith((b"{",b"[")):
                  for enc in ("utf-8-sig","utf-8","cp950","big5"):
                      try:
                          obj=json.loads(raw.decode(enc))
                          print("JSON_SHAPE",type(obj).__name__, list(obj)[:20] if isinstance(obj,dict) else len(obj))
                          if isinstance(obj,list):
                              return obj,enc,len(raw)
                          if isinstance(obj,dict):
                              for key in ("data","Data","result","Result","items","Items"):
                                  if isinstance(obj.get(key),list):
                                      return obj[key],enc,len(raw)
                      except Exception:
                          pass
              for enc in tuple(x for x in (info["charset"],"utf-8-sig","utf-8","cp950","big5","latin1") if x):
                  try:
                      text=raw.decode(enc)
                      print("DECODE_OK",enc,"PREVIEW",repr(text[:300]))
                      rows=list(csv.DictReader(io.StringIO(text)))
                      if rows and rows[0] and len(rows[0])>1:
                          return rows,enc,len(raw)
                  except Exception as exc:
                      print("DECODE_FAIL",enc,repr(exc))
              raise RuntimeError("cannot parse source response")

          static,se,sbytes=fetch(STATIC)
          live,le,lbytes=fetch(LIVE)
          print("STATIC_ROWS",len(static),"ENC",se,"BYTES",sbytes)
          print("LIVE_ROWS",len(live),"ENC",le,"BYTES",lbytes)
          print("STATIC_KEYS",list(static[0].keys()))
          print("LIVE_KEYS",list(live[0].keys()))
          print("STATIC_SAMPLE",json.dumps(static[0],ensure_ascii=False)[:2500])
          print("LIVE_SAMPLE",json.dumps(live[0],ensure_ascii=False)[:1200])

          def norm_id(row):
              for k in ("ID","Id","id"):
                  if row.get(k):
                      return str(row[k]).strip()
              return ""
          smap={norm_id(x):x for x in static if norm_id(x)}
          lmap={norm_id(x):x for x in live if norm_id(x)}
          common=set(smap)&set(lmap)
          print("COMMON_IDS",len(common))
          if common:
              sid=next(iter(common))
              print("JOIN_SAMPLE_ID",sid)
              print("JOIN_STATIC",json.dumps(smap[sid],ensure_ascii=False)[:2000])
              print("JOIN_LIVE",json.dumps(lmap[sid],ensure_ascii=False)[:1000])
          assert len(static)>50
          assert len(live)>20
          assert len(common)>20
          PY
