name: Publish CarKit shortcuts to website

on:
  push:
    branches:
      - feature/carkit-auto-launch
    paths:
      - .github/workflows/publish-carkit-shortcuts.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: feature/carkit-auto-launch

      - name: Download latest signed CarKit shortcuts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GH_REPO/actions/runs?branch=temp%2Fcarkit-shortcut-sign&status=success&per_page=20" --jq '.workflow_runs[] | select(.name=="CarKit Shortcut Build") | .id' | head -n 1)"
          test -n "$run_id"
          echo "Using signed CarKit build run: $run_id"
          rm -rf /tmp/carkit-signed
          mkdir -p /tmp/carkit-signed
          gh run download "$run_id"             --repo "$GH_REPO"             --name carkit-signed-shortcuts             --dir /tmp/carkit-signed

          test -s "/tmp/carkit-signed/油車助手.shortcut"
          test -s "/tmp/carkit-signed/特斯拉助手.shortcut"

          python3 - <<'PY'
          from pathlib import Path
          for name in ("油車助手.shortcut","特斯拉助手.shortcut"):
              data=(Path("/tmp/carkit-signed")/name).read_bytes()
              assert data[:4] == b"AEA1", (name,data[:4])
              print(name,len(data),"AEA1")
          PY

      - name: Publish website download files
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp "/tmp/carkit-signed/油車助手.shortcut" downloads/oil-driver.shortcut
          cp "/tmp/carkit-signed/特斯拉助手.shortcut" downloads/tesla-driver.shortcut

      - name: Commit website shortcut binaries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/oil-driver.shortcut downloads/tesla-driver.shortcut
          if git diff --cached --quiet; then
            echo "Shortcut files already current."
            exit 0
          fi
          git commit -m "assets: publish signed CarKit shortcuts"
          git push origin HEAD:feature/carkit-auto-launch
