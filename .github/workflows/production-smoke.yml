name: Smoke test COLA GO production

on:
  workflow_run:
    workflows: ["Deploy COLA GO to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production website and TDX cache
        shell: bash
        run: |
          set -euo pipefail
          base="https://ykc1117.github.io/cola-go"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          for attempt in {1..12}; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/data/tdx/status.json" -o "$work/status.json"; then
              if python3 - "$work/status.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          ds=data.get("datasets",{})
          ok=(ds.get("charging",{}).get("count",0)>0 and
              ds.get("traffic",{}).get("count",0)>0 and
              ds.get("tunnel",{}).get("count",0)>0 and
              ds.get("cctv",{}).get("count",0)>0)
          raise SystemExit(0 if ok else 1)
          PY
              then
                break
              fi
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Production TDX status did not become ready." >&2
              exit 1
            fi
            sleep 10
          done

          curl -fsSL "$base/" -o "$work/index.html"
          curl -fsSL "$base/assets/app.js" -o "$work/app.js"
          curl -fsSL "$base/assets/tdx-runtime.js" -o "$work/tdx-runtime.js"
          curl -fsSL "$base/manifest.webmanifest" -o "$work/manifest.webmanifest"
          curl -fsSL "$base/sw.js" -o "$work/sw.js"
          curl -fsSL "$base/downloads/oil-driver.shortcut" -o "$work/oil-driver.shortcut"
          curl -fsSL "$base/downloads/tesla-driver.shortcut" -o "$work/tesla-driver.shortcut"
          curl -fsSL "$base/data/tdx/charging.json" -o "$work/charging.json"
          curl -fsSL "$base/data/tdx/traffic.json" -o "$work/traffic.json"
          curl -fsSL "$base/data/tdx/tunnel.json" -o "$work/tunnel.json"
          curl -fsSL "$base/data/tdx/cctv.json" -o "$work/cctv.json"
          curl -fsSL "$base/data/tdx/parking/Tainan.json" -o "$work/tainan.json"

          grep -Fq 'assets/tdx-runtime.js' "$work/index.html"
          grep -Fq './downloads/oil-driver.shortcut' "$work/index.html"
          grep -Fq './downloads/tesla-driver.shortcut' "$work/index.html"
          grep -Fq '下載油車助手 v1.3（正式檔）' "$work/index.html"
          grep -Fq '下載特斯拉助手 v1.6（正式檔）' "$work/index.html"
          printf '%s  %s\n' '5c93e0962c98fae03e5590608332e6571912406b98d021ed87ad5e10d1ec836b' "$work/oil-driver.shortcut" | sha256sum -c -
          printf '%s  %s\n' '9288fe2d90db62258d43a10ba6b007b766bd94d848d15ced2b5a917bb6179438' "$work/tesla-driver.shortcut" | sha256sum -c -
          grep -Fq 'id="chargingNearby"' "$work/index.html"
          grep -Fq 'id="chargingAvailableOnly"' "$work/index.html"
          grep -Fq 'id="chargingCity"' "$work/index.html"
          grep -Fq 'data-charge-nav-toggle' "$work/app.js"
          grep -Fq 'chargingAvailableOnly' "$work/app.js"
          grep -Fq '電小二 EV2' "$work/app.js"
          grep -Fq 'https://www.ev2.com.tw/' "$work/app.js"
          grep -Fq 'U-POWER' "$work/app.js"
          grep -Fq 'https://www.u-power.com.tw/' "$work/app.js"
          grep -Fq 'data-charge-major="evoasis"' "$work/index.html"
          grep -Fq 'data-charge-major="upower"' "$work/index.html"
          grep -Fq 'data-charge-major="tail"' "$work/index.html"
          grep -Fq 'data-charge-major="evalue"' "$work/index.html"
          grep -Fq 'data-charge-major="icharging"' "$work/index.html"
          grep -Fq 'data-charge-major="tesla"' "$work/index.html"
          grep -Fq 'const TAIWAN_CITIES=' "$work/app.js"
          grep -Fq 'chargingOperatorLabel(name)' "$work/tdx-runtime.js"
          grep -Fq 'cola-go-ui-v6-27' "$work/sw.js"
          ! grep -Fq 'www.icloud.com/shortcuts/' "$work/index.html"
          ! grep -Eqi 'waze\.com|data-map="waze"' "$work/index.html" "$work/app.js"
          grep -Fq 'el.hasAttribute("data-home-reload")' "$work/app.js"
          grep -Fq 'class="hero-brand" data-go="home" data-home-reload type="button"' "$work/index.html"
          grep -Fq 'location.reload()' "$work/app.js"
          grep -Fq '$$("[data-go]").forEach' "$work/app.js"
          grep -Fq './data/tdx/traffic.json' "$work/tdx-runtime.js"
          grep -Fq './data/tdx/tunnel.json' "$work/tdx-runtime.js"
          grep -Fq 'u.pathname.includes("/data/tdx/")' "$work/sw.js"

          python3 - "$work" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          status=json.load(open(root/"status.json", encoding="utf-8"))
          charging=json.load(open(root/"charging.json", encoding="utf-8"))
          traffic=json.load(open(root/"traffic.json", encoding="utf-8"))
          tunnel=json.load(open(root/"tunnel.json", encoding="utf-8"))
          cctv=json.load(open(root/"cctv.json", encoding="utf-8"))
          tainan=json.load(open(root/"tainan.json", encoding="utf-8"))

          assert status["source"] == "TDX／交通部"
          assert status["datasets"]["charging"]["count"] > 0
          assert status["datasets"]["traffic"]["count"] > 0
          assert status["datasets"]["tunnel"]["count"] > 0
          assert status["datasets"]["cctv"]["count"] > 0

          assert charging.get("status") in {"live","partial","stale","official"}
          assert len(charging.get("items",[])) > 0

          items=charging.get("items",[])
          detailed_location=sum(1 for x in items if x.get("location") and x.get("location") != x.get("cityName"))
          numeric_operator=sum(1 for x in items if str(x.get("operator") or "").isdigit() and len(str(x.get("operator") or "")) == 8)
          numeric_connector_rows=sum(1 for x in items if any(str(v).isdigit() for v in (x.get("connectors") or [])))
          normalized_connector=sum(1 for x in items if any(str(v) in {"CCS1","CCS2","CHAdeMO","Tesla TPC","J1772","Type2","其他"} for v in (x.get("connectors") or [])))

          # Charging data-quality guards: fail loudly instead of silently regressing.
          assert detailed_location >= int(len(items) * 0.90), (detailed_location, len(items))
          assert numeric_operator == 0, numeric_operator
          assert numeric_connector_rows == 0, numeric_connector_rows
          assert normalized_connector >= len(items) - 20, (normalized_connector, len(items))

          assert traffic.get("status") in {"live","stale"}
          assert sum(len(v) for v in traffic.get("highways",{}).values()) > 0
          assert tunnel.get("status") in {"live","stale"}
          assert len(tunnel.get("south",[])) + len(tunnel.get("north",[])) > 0
          assert len(cctv.get("items",[])) > 0
          assert len(tainan.get("items",[])) > 0

          print("PRODUCTION_SMOKE_PASS")
          print("charging", len(charging["items"]), charging.get("status"), charging.get("updatedAt"))
          print("charging diagnostics", "detailed_location", detailed_location, "numeric_operator", numeric_operator, "numeric_connector_rows", numeric_connector_rows, "normalized_connector", normalized_connector)
          print("traffic", sum(len(v) for v in traffic["highways"].values()), traffic.get("status"), traffic.get("updatedAt"))
          print("tunnel", len(tunnel.get("south",[])), len(tunnel.get("north",[])), tunnel.get("status"), tunnel.get("updatedAt"))
          print("cctv", len(cctv["items"]), cctv.get("updatedAt"))
          print("tainan", len(tainan["items"]), tainan.get("status"), tainan.get("updatedAt"))
          PY
