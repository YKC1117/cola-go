name: Multi City Parking QA

on:
  push:
    branches: ["feature/parking-taoyuan-live"]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - "sw.js"
      - "scripts/sync_taoyuan_parking.py"
      - "data/parking-live-taoyuan.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/parking-multicity-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax and real Taoyuan source
        run: |
          node --check assets/app.js
          node --check sw.js
          python3 -m py_compile scripts/sync_taoyuan_parking.py
          python3 scripts/sync_taoyuan_parking.py | tee /tmp/taoyuan.log
          grep -q "TAOYUAN_PARKING_SYNC_OK" /tmp/taoyuan.log
          python3 - <<'PY'
          import json
          d=json.load(open("data/parking-live-taoyuan.json",encoding="utf-8"))
          assert d["status"]=="live"
          assert len(d["items"])>50
          assert sum(1 for x in d["items"] if x["car"] is not None)>20
          assert sum(1 for x in d["items"] if x["lat"] is not None and x["lng"] is not None)>50
          print("TAOYUAN_REAL_ROWS",len(d["items"]))
          PY

      - name: Install browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1

      - name: Multi-city parking interactions
        run: |
          cat > parking-multicity-qa.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/';
          const out='parking-multicity-artifacts';
          fs.mkdirSync(out,{recursive:true});

          const tainan={
            status:'live',updatedAt:'2026-09-25T00:30:00+08:00',
            items:[
              {id:'tn1',name:'台南近站',zone:'永康區',address:'台南市永康區中華路1號',car:4,carTotal:50,green:1,chargeTime:'24H',chargeFee:'每小時30元',sourceUpdate:'2026-09-25 00:30:00',lat:23.001,lng:120.221},
              {id:'tn2',name:'台南遠站',zone:'安平區',address:'台南市安平區永華路2號',car:30,carTotal:80,green:2,chargeTime:'24H',chargeFee:'每小時40元',sourceUpdate:'2026-09-25 00:30:00',lat:22.99,lng:120.17}
            ]
          };
          const taoyuan={
            status:'live',updatedAt:'2026-09-25T00:31:00+08:00',
            items:[
              {id:'ty1',name:'桃園近站',zone:'桃園區',address:'桃園市桃園區中正路1號',car:5,carTotal:100,evTotal:6,chargeTime:'依現場',chargeFee:'每小時30元',sourceUpdate:'2026-09-25T00:31:00+08:00',lat:24.993,lng:121.301},
              {id:'ty2',name:'桃園多位站',zone:'八德區',address:'桃園市八德區廣福路2號',car:40,carTotal:150,evTotal:3,chargeTime:'依現場',chargeFee:'每小時40元',sourceUpdate:'2026-09-25T00:31:00+08:00',lat:24.96,lng:121.30},
              {id:'ty3',name:'桃園未知站',zone:'中壢區',address:'桃園市中壢區中央路3號',car:null,carTotal:60,evTotal:2,chargeTime:'依現場',chargeFee:'依現場',sourceUpdate:'2026-09-25T00:31:00+08:00',lat:24.95,lng:121.22}
            ]
          };

          async function run(browserType,label){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:430,height:932},
              isMobile:true,hasTouch:true,serviceWorkers:'block',
              geolocation:{latitude:24.9928,longitude:121.3008},
              permissions:['geolocation']
            });
            await context.addInitScript(()=>{
              window.__opened=[];
              window.open=(url)=>{window.__opened.push(String(url));return null;};
            });
            await context.route('**/data/parking-live-tainan.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(tainan)}));
            await context.route('**/data/parking-live-taoyuan.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(taoyuan)}));
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('[data-go="parking"]').first().click();

            if(!(await page.locator('#parkingCityTitle').textContent()).includes('臺南'))throw new Error(label+' default city Tainan');
            if(!(await page.locator('.parking-card').first().textContent()).includes('台南遠站'))throw new Error(label+' Tainan availability sort');

            await page.locator('[data-parking-city="taoyuan"]').click();
            if(!(await page.locator('#parkingCityTitle').textContent()).includes('桃園'))throw new Error(label+' Taoyuan title');
            if(await page.locator('.parking-card').count()!==3)throw new Error(label+' Taoyuan card count');
            if(!(await page.locator('.parking-card').first().textContent()).includes('桃園多位站'))throw new Error(label+' Taoyuan availability sort');

            const unknown=page.locator('.parking-card').filter({hasText:'桃園未知站'});
            const unknownText=await unknown.textContent();
            if(!unknownText.includes('—'))throw new Error(label+' unknown availability must be dash');
            if(!unknownText.includes('充電車位'))throw new Error(label+' Taoyuan EV label');

            await page.locator('#parkingSortNearest').click();
            await page.waitForFunction(()=>document.querySelector('.parking-card .parking-zone')?.textContent.includes('距離'));
            if(!(await page.locator('.parking-card').first().textContent()).includes('桃園近站'))throw new Error(label+' Taoyuan nearest sort');

            await page.locator('#parkingHasSpaceOnly').click();
            if(await page.locator('.parking-card').count()!==2)throw new Error(label+' Taoyuan has-space filter');

            await page.locator('#parkingSearch').fill('八德');
            if(await page.locator('.parking-card').count()!==1)throw new Error(label+' Taoyuan search');

            const card=page.locator('.parking-card').first();
            await card.locator('[data-parking-map]').click();
            await card.locator('[data-parking-apple]').click();
            const opened=await page.evaluate(()=>window.__opened);
            if(!opened.some(x=>x.includes('google.com/maps/search')))throw new Error(label+' Google nav');
            if(!opened.some(x=>x.includes('maps.apple.com')))throw new Error(label+' Apple nav');

            await page.locator('[data-parking-city="tainan"]').click();
            if((await page.locator('#parkingSearch').inputValue())!=='')throw new Error(label+' city switch clears search');
            if(!(await page.locator('#parkingCityTitle').textContent()).includes('臺南'))throw new Error(label+' return Tainan');

            await page.screenshot({path:out+'/parking-multicity-'+label+'.png',fullPage:true});
            if(errors.length)throw new Error(label+' page errors '+errors.join(' | '));
            await browser.close();
          }

          await run(chromium,'chromium');
          await run(webkit,'webkit');
          console.log('PARKING_MULTICITY_QA_SUCCESS');
          EOF
          node parking-multicity-qa.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-multicity-qa
          path: parking-multicity-artifacts
          retention-days: 2
