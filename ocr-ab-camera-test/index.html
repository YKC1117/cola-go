<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OCR A/B 相機 POC</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--blue:#1769aa;--green:#14833b;--red:#c62828;--amber:#9a6200;--border:#d7dee7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}h1{font-size:24px;margin:4px 0 6px}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}.step{font-weight:900;font-size:20px}.status{margin-top:8px;padding:14px;border-radius:12px;background:#eef6fd;color:var(--blue);font-weight:900;text-align:center;font-size:22px}.status.ok{background:#eaf7ee;color:var(--green)}.status.ng{background:#fdecec;color:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{min-height:58px;padding:10px;border:2px solid var(--border);border-radius:11px;background:#fafafa;font-family:Consolas,monospace;font-size:19px;font-weight:800;word-break:break-all}.label{font-size:12px;color:var(--muted);margin-bottom:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,label.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:none;border-radius:11px;font-weight:900;font-size:16px;padding:10px;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:white;color:var(--blue);border:1px solid #9fb8cb!important}.danger{background:#fff0f0;color:#b71c1c;border:1px solid #e7a3a3!important}.hidden{display:none!important}.progress{font-size:13px;font-weight:800;color:#365a73;min-height:20px;margin:10px 0}.preview{display:none;margin-top:10px}.preview.show{display:block}.preview img{width:100%;max-height:280px;object-fit:contain;border:1px solid var(--border);border-radius:10px}.resultEdit{width:100%;font-size:19px;padding:10px;border:2px solid #7aa7cc;border-radius:10px;font-family:Consolas,monospace}.small{font-size:12px;color:var(--muted);line-height:1.5}.raw{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--border);padding:8px;border-radius:8px;max-height:150px;overflow:auto;font-size:11px}.badge{display:inline-block;padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:12px;font-weight:800}.count{font-size:14px;font-weight:800;text-align:center;min-height:20px;margin-top:6px}@media(max-width:520px){.row,.actions{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>OCR A/B 相機測試</h1>
<div class="sub">iPhone / Android 直接拍一般印刷文字。這只是 POC，用來確認「普通字型 → 相機 OCR → A/B 比對」是否可行，不是正式客戶版。</div>

<div class="card">
  <div><span id="engineBadge" class="badge">OCR 引擎檢查中</span></div>
  <div class="step" id="stepText" style="margin-top:10px">目前：拍 A</div>
  <div id="status" class="status">請拍 A</div>
  <div class="count" id="countdown"></div>
</div>

<div class="card">
  <div class="row">
    <div><div class="label">A</div><div id="aBox" class="box"></div></div>
    <div><div class="label">B</div><div id="bBox" class="box"></div></div>
  </div>
</div>

<div class="card">
  <div class="actions">
    <label class="btn primary">拍照辨識目前步驟<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"></label>
    <label class="btn secondary">從相簿選照片<input id="galleryInput" type="file" accept="image/*" class="hidden"></label>
  </div>
  <div id="progress" class="progress">尚未拍照</div>
  <div id="preview" class="preview"><img id="previewImg"></div>
  <div class="label" style="margin-top:10px">OCR 辨識結果</div>
  <input id="ocrResult" class="resultEdit" placeholder="辨識後會出現在這裡，可手動修正">
  <div class="actions" style="margin-top:10px">
    <button id="sendBtn" class="btn primary">確認送入 A/B</button>
    <button id="resetBtn" class="btn danger">全部清除</button>
  </div>
  <div class="small" style="margin-top:10px">目前優先抓 6碼-6碼-2碼，例如 ES2L10-152028-11、ESCX44-000032-11。辨識出的 .、_、長橫線會先修正成 -。</div>
  <details style="margin-top:10px"><summary class="small">查看 OCR 原始文字</summary><pre id="rawText" class="raw"></pre></details>
</div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let worker=null,busy=false,phase='A',A='',B='',timer=null;

function setStatus(text,type='wait'){
  const s=$('status');s.textContent=text;s.className='status'+(type==='ok'?' ok':type==='ng'?' ng':'');
}
function updateStep(){ $('stepText').textContent=phase==='A'?'目前：拍 A':'目前：拍 B'; }
function clearAll(){ if(timer){clearInterval(timer);timer=null}$('countdown').textContent='';phase='A';A=B='';$('aBox').textContent='';$('bBox').textContent='';$('ocrResult').value='';updateStep();setStatus('請拍 A'); }
function normalize(s){return String(s||'').toUpperCase().replace(/[‐‑‒–—―]/g,'-').replace(/[._]/g,'-');}
function extract(raw){
  const t=normalize(raw);const c=[...t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),t.replace(/\s+/g,'')];
  const strict=/[A-Z0-9]{6}[-][A-Z0-9]{6}[-][A-Z0-9]{2}/;
  for(const x of c){const m=x.replace(/\s+/g,'').match(strict);if(m)return m[0]}
  const flex=/[A-Z0-9]{2,12}-[A-Z0-9]{2,12}-[A-Z0-9]{1,6}/;
  for(const x of c){const m=x.replace(/\s+/g,'').match(flex);if(m)return m[0]}
  const toks=t.match(/[A-Z0-9][A-Z0-9\-._]{5,40}/g)||[];return toks[0]?normalize(toks[0]):'';
}
function send(v){v=normalize(v).trim();if(!v)return;
  if(phase==='A'){A=v;$('aBox').textContent=A;phase='B';updateStep();setStatus('A 已讀取，請拍 B');return;}
  B=v;$('bBox').textContent=B;
  if(A===B){setStatus('PASS','ok');startCountdown();}else{setStatus('NG｜A / B 不一致','ng');}
}
function startCountdown(){let n=2;$('countdown').textContent=n+' 秒後清除';timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);timer=null;clearAll()}else $('countdown').textContent=n+' 秒後清除';},1000);}
async function ensureWorker(){
  if(worker)return worker;if(!window.Tesseract)throw new Error('OCR 引擎載入失敗，請確認網路後重新整理');
  $('progress').textContent='第一次載入 OCR 引擎，請稍候…';
  worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m&&m.status){const p=typeof m.progress==='number'?' '+Math.round(m.progress*100)+'%':'';$('progress').textContent='OCR：'+m.status+p;}}});
  await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._/—–',preserve_interword_spaces:'1'});return worker;
}
function preprocess(img){const max=1800,scale=Math.min(1,max/img.naturalWidth,max/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const im=ctx.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=(g-128)*1.45+128;g=Math.max(0,Math.min(255,g));d[i]=d[i+1]=d[i+2]=g}ctx.putImageData(im,0,0);return c;}
async function run(file){if(!file||busy)return;busy=true;const url=URL.createObjectURL(file);try{
  $('progress').textContent='讀取照片…';const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});$('previewImg').src=url;$('preview').classList.add('show');
  const w=await ensureWorker();$('progress').textContent='正在辨識文字…';const ret=await w.recognize(preprocess(img));const raw=ret?.data?.text||'';$('rawText').textContent=raw||'（沒有辨識到文字）';const v=extract(raw);$('ocrResult').value=v;
  if(v){$('progress').textContent='辨識完成：'+v;send(v)}else{$('progress').textContent='辨識完成，但沒找到符合格式的料號，可查看原始文字或手動修正。'}
}catch(e){console.error(e);$('progress').textContent='OCR 失敗：'+(e?.message||String(e));}finally{busy=false;setTimeout(()=>URL.revokeObjectURL(url),3000)}}
$('cameraInput').onchange=e=>{const f=e.target.files?.[0];if(f)run(f);e.target.value=''};
$('galleryInput').onchange=e=>{const f=e.target.files?.[0];if(f)run(f);e.target.value=''};
$('sendBtn').onclick=()=>send($('ocrResult').value);
$('resetBtn').onclick=clearAll;
window.addEventListener('load',()=>{$('engineBadge').textContent=window.Tesseract?'OCR 引擎已載入':'OCR 引擎載入失敗';$('engineBadge').style.color=window.Tesseract?'#14833b':'#c62828';clearAll()});
})();
</script>
</body>
</html>
