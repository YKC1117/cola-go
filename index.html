<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex,nofollow">
  <title>COLA GO｜暫停服務</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f5f5f5;padding:24px}
    main{width:min(560px,100%);padding:36px 28px;border:1px solid #2b2b2b;border-radius:22px;background:#181818;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center}
    .brand{font-weight:800;letter-spacing:.08em;font-size:30px;margin-bottom:18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e53935;margin-right:10px;vertical-align:3px}
    h1{font-size:24px;margin:0 0 14px}p{margin:0;color:#bdbdbd;line-height:1.8;font-size:16px}.small{margin-top:20px;font-size:13px;color:#777}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="dot"></span>COLA GO</div>
    <h1>目前暫停服務</h1>
    <p>網站與即時資料服務已暫時關閉。<br>後續重新開放時會再恢復使用。</p>
    <div class="small">COLA GO</div>
  </main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
      }catch(e){}
    })();
  </script>
</body>
</html>
